<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100a1d"><title>4W1F · Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#08070d;color:#f5f1ff;font:15px system-ui,-apple-system,sans-serif}main{max-width:460px;margin:auto;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#52228d88,transparent 42%),#100d1b;padding:24px 20px 100px}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:26px;font-weight:900;letter-spacing:1px}.logo span{color:#b78cff}.tag{background:#312047;border:1px solid #74549b;border-radius:99px;padding:6px 10px;font-size:12px}.hero{margin:30px 0 22px;padding:25px 20px;border:1px solid #68439a;border-radius:22px;background:linear-gradient(140deg,#39215b,#181124)}h1{font-size:28px;margin:0 0 8px}p{color:#c8bdd7;line-height:1.5}h2{font-size:18px;margin:28px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.panel{background:#20182d;border:1px solid #40304e;border-radius:18px;padding:20px;cursor:pointer;color:inherit;text-align:left}.tile b{display:block;margin-top:12px}.tile small{display:block;color:#a99ab9;margin-top:4px}.panel{width:100%;cursor:default}.panel h2{margin:0 0 8px}.panel p{margin:0}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:#1c1428;border-top:1px solid #4c326b;display:flex;justify-content:space-around;padding:12px 0 20px}nav button{background:none;border:0;color:#d6c4ee;font:inherit;cursor:pointer}.hide{display:none}.notice{font-size:12px;color:#ac9cbf;margin-top:18px}</style></head><body><main><div class="top"><div class="logo">4<span>W</span>1F</div><div class="tag">PRÄSENTATIONS-DEMO</div></div><section class="hero"><h1>4 Wheels<br>1 Family 💜</h1><p>Mehr als nur Autos. Eine Community, gemeinsame Erlebnisse und alles an einem Ort.</p></section><div id="home"><h2>Entdecke die Crew-App</h2><div class="grid"><button class="tile" onclick="show('events')">📅<b>Events</b><small>Treffen & Ausfahrten</small></button><button class="tile" onclick="show('gallery')">📸<b>Galerie</b><small>Unsere Momente</small></button><button class="tile" onclick="show('live')">📍<b>Crew Live</b><small>Standorte teilen</small></button><button class="tile" onclick="show('profile')">👤<b>Profil</b><small>Fahrzeuge & Infos</small></button><button class="tile" onclick="show('news')">📢<b>News</b><small>Mitteilungen</small></button><button class="tile" onclick="show('support')">💬<b>Support</b><small>Fragen & Feedback</small></button></div></div><section id="detail" class="hide"><button class="tile" onclick="show('home')">← Zurück</button><div class="panel" style="margin-top:18px"><h2 id="title"></h2><p id="description"></p></div></section><p class="notice">Offline-Demo mit Beispieldaten. Keine Anmeldung, keine Live-Funktionen, keine echten Mitgliederdaten.</p></main><nav><button onclick="show('home')">⌂ Home</button><button onclick="show('events')">▦ Events</button><button onclick="show('gallery')">▧ Galerie</button><button onclick="show('profile')">◉ Profil</button></nav><script>const pages={events:['📅 Events','Hier wurden Treffen, Ausfahrten und gemeinsame Aktivitäten geplant und verwaltet.'],gallery:['📸 Galerie','Hier konnten Mitglieder Bilder und Erinnerungen aus der Crew teilen.'],live:['📍 Crew Live','Hier war die gemeinsame Standortansicht der Crew vorgesehen. Live-Ortung ist in der Demo deaktiviert.'],profile:['👤 Profil','Persönliche Profile, Fahrzeuge und Mitgliedsinformationen. In dieser Demo werden keine echten Daten angezeigt.'],news:['📢 Mitteilungen','Wichtige Ankündigungen, Neuigkeiten und Lesebestätigungen.'],support:['💬 Support','Kontakt und Feedback direkt über die App.']};function show(k){document.getElementById('home').classList.toggle('hide',k!=='home');document.getElementById('detail').classList.toggle('hide',k==='home');if(pages[k]){document.getElementById('title').textContent=pages[k][0];document.getElementById('description').textContent=pages[k][1]};window.scrollTo(0,0)}</script></body></html>

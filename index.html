<style>
:root{--bg:#050507;--panel:#0d0d11;--panel2:#121217;--panel3:#17171d;--text:#f7f6fa;--muted:#9b99a5;--line:#2a2931;--purple:#9b34ff;--purple2:#d32cc9;--purple3:#6326e8;--green:#32da83;--red:#ff4d5e;--amber:#ffb328;--blue:#5897ff;--shadow:0 18px 60px rgba(0,0,0,.45);--glow:0 0 28px rgba(155,52,255,.24)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}body{background:radial-gradient(circle at 50% -5%,rgba(113,37,175,.16),transparent 32%),#050507}button,input,textarea,select{font:inherit}button{color:inherit}button:disabled{opacity:.45;pointer-events:none}.app{max-width:850px;margin:0 auto;min-height:100vh;padding-bottom:104px;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.008),transparent 25%)}
.top{padding:max(18px,env(safe-area-inset-top)) 20px 12px;position:relative;z-index:10;background:linear-gradient(180deg,rgba(5,5,7,.97),rgba(5,5,7,.84),rgba(5,5,7,0));}.brandrow{min-height:114px;display:grid;grid-template-columns:74px 1fr 92px;align-items:center;gap:10px}.manifesto{font-size:8px;font-weight:800;letter-spacing:4px;line-height:1.8;color:#eceaf3;text-align:left}.wordmark{text-align:center;line-height:.85}.wordmark .brush{font-family:"Permanent Marker",cursive;font-size:28px;transform:rotate(-3deg);display:inline-block;text-transform:uppercase;text-shadow:0 0 18px rgba(255,255,255,.08)}.wordmark .brush em{color:var(--purple);font-style:normal}.wordmark small{display:block;margin-top:10px;font-size:8px;letter-spacing:5px;text-transform:uppercase;color:#b4b0bb}.top-actions{display:flex;justify-content:flex-end;gap:8px}.iconbtn{width:43px;height:43px;border:1px solid var(--line);border-radius:14px;background:#0b0b0f;display:grid;place-items:center;position:relative}.iconbtn svg{width:22px;height:22px;stroke:#f6f4fb}.badge{position:absolute;top:-7px;right:-6px;min-width:21px;height:21px;padding:0 6px;background:linear-gradient(135deg,var(--purple),var(--purple2));border-radius:999px;font-size:11px;font-weight:800;display:grid;place-items:center}.hidden{display:none!important}
.view{padding:0 18px 22px}.page-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:4px 2px 14px}.page-title h1{font-family:"Barlow Condensed";font-size:34px;line-height:.95;text-transform:uppercase;margin:0;letter-spacing:.4px}.page-title h1 span{color:var(--purple)}.kicker{font-size:8px;letter-spacing:4px;font-weight:800;color:#c7c4cf;text-transform:uppercase;margin-top:7px}.btn{border:1px solid var(--line);border-radius:11px;padding:12px 15px;background:#0d0d12;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}.btn svg{width:18px;height:18px;stroke:currentColor}.btn.primary{border-color:transparent;background:linear-gradient(135deg,#7629ff,var(--purple),var(--purple2));box-shadow:var(--glow)}.btn.outline{background:#0a0a0e}.btn.ghost{background:transparent;border-color:transparent}.btn.good{border-color:rgba(50,218,131,.55);background:rgba(23,124,73,.2)}.btn.bad{border-color:rgba(255,77,94,.45);background:rgba(125,24,34,.2)}.btn.warn{border-color:rgba(255,179,40,.5);background:rgba(126,82,14,.2)}.btn.sm{padding:8px 10px;min-height:35px;font-size:12px}.btn.wide{width:100%}.card{background:linear-gradient(180deg,#101014,#0b0b0e);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.2)}.card.pad{padding:14px}.card.clickable{cursor:pointer}.label{display:inline-flex;align-items:center;border:1px solid rgba(155,52,255,.55);color:#ce82ff;border-radius:7px;padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.label.owner{color:#d665ff;border-color:#a13dff}.label.admin{color:#d665ff}.label.member{color:#ddd;border-color:#777}.label.function{color:#78d7ff;border-color:#2676a8;background:#0a1620}.gradient-label{background:linear-gradient(90deg,#7a31ff,#d231c6);padding:6px 10px;border-radius:7px;font-size:10px;letter-spacing:1.7px;font-weight:900;text-transform:uppercase}.section{margin-top:17px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 9px}.sectionhead h2{font-size:19px;margin:0}.sectionhead .link{color:#c962ff;font-size:12px;background:none;border:0}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.eyebrow{font-size:9px;letter-spacing:3px;color:#d564ff;font-weight:900;text-transform:uppercase}.script{font-family:"Permanent Marker",cursive;color:#bd5cff;font-weight:400}

/* V1.3 community polish */
.view{animation:pageIn .34s cubic-bezier(.2,.75,.25,1)}
@keyframes pageIn{from{opacity:.15;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes glowBreath{0%,100%{box-shadow:0 0 0 rgba(155,52,255,0)}50%{box-shadow:0 0 34px rgba(155,52,255,.20)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(50,218,131,.42)}70%{box-shadow:0 0 0 10px rgba(50,218,131,0)}100%{box-shadow:0 0 0 0 rgba(50,218,131,0)}}
.card,.btn,.navbtn{transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease,opacity .18s ease}
.btn:active,.card.clickable:active,.member-row.clickable:active{transform:scale(.985)}
.navbtn.active svg{filter:drop-shadow(0 0 7px rgba(155,52,255,.65))}
.navbtn.active span{text-shadow:0 0 14px rgba(155,52,255,.45)}
.hero-event:after{content:"";position:absolute;inset:-35%;pointer-events:none;background:radial-gradient(circle at 75% 35%,rgba(176,55,255,.18),transparent 30%);mix-blend-mode:screen;animation:ambientMove 10s ease-in-out infinite alternate}
@keyframes ambientMove{from{transform:translate3d(-2%,0,0)}to{transform:translate3d(6%,3%,0)}}
.welcome-card{overflow:hidden;position:relative;padding:17px;background:linear-gradient(135deg,rgba(122,41,255,.20),rgba(13,13,17,.96) 45%,rgba(211,44,201,.08));border-color:rgba(155,52,255,.38)}
.welcome-card:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-60px;top:-85px;background:radial-gradient(circle,rgba(191,65,255,.28),transparent 67%);filter:blur(2px)}
.welcome-title{font-family:"Barlow Condensed";font-size:27px;line-height:1;text-transform:uppercase;margin:4px 0 7px}.welcome-title span{color:var(--purple)}
.value-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.value-pill{border:1px solid var(--line);background:rgba(0,0,0,.28);border-radius:10px;padding:9px 5px;text-align:center;font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}.value-pill b{display:block;color:#d25cff;font-size:13px;margin-bottom:3px}
.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.project-card{padding:13px;min-height:128px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}.project-card h3{margin:1px 0;font-size:15px}.project-card p{margin:0;font-size:10px;color:var(--muted);line-height:1.45}.project-card .project-icon{font-size:22px}.project-status{display:inline-flex;align-items:center;width:max-content;padding:4px 7px;border-radius:999px;border:1px solid #41414b;font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.project-status.live{color:#6affad;border-color:rgba(50,218,131,.45);background:rgba(50,218,131,.08)}.project-status.work{color:#d078ff;border-color:rgba(155,52,255,.5);background:rgba(155,52,255,.08)}.project-status.vote{color:#ffd16b;border-color:rgba(255,179,40,.45);background:rgba(255,179,40,.07)}
.new-members{display:flex;gap:8px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.new-members::-webkit-scrollbar{display:none}.new-member{min-width:150px;padding:11px}.new-member .avatar{margin-bottom:8px}.new-badge{display:inline-flex;background:linear-gradient(135deg,#7629ff,#d32cc9);border-radius:999px;padding:3px 7px;font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-left:5px}
.media-hub{padding:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#111117,#08080b 64%,rgba(155,52,255,.16));}.media-hub:after{content:"▶";position:absolute;right:15px;top:8px;font-size:62px;color:rgba(155,52,255,.10);font-weight:900}.media-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.media-links .btn{position:relative;z-index:1}
.onboard-progress{height:7px;background:#1b1a21;border-radius:999px;overflow:hidden;margin:9px 0 4px}.onboard-progress i{display:block;height:100%;background:linear-gradient(90deg,#7629ff,#d32cc9);border-radius:inherit}.checklist{display:grid;gap:8px}.checkitem{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:#0b0b0f}.checkmark{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:rgba(50,218,131,.12);border:1px solid rgba(50,218,131,.38);color:#55e99a;font-weight:900}.crew-dna{display:grid;gap:8px}.dna-item{padding:13px;border-left:2px solid var(--purple);background:linear-gradient(90deg,rgba(155,52,255,.08),transparent 60%);border-radius:0 10px 10px 0}.dna-item b{display:block;margin-bottom:4px}.dna-item span{font-size:11px;color:var(--muted);line-height:1.45}
.member-bio{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}.member-row.clickable{cursor:pointer}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);animation:livePulse 1.7s infinite;margin-right:6px}
.project-admin-row{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin-bottom:8px}.project-admin-row select{min-height:40px}
.brand-accent{background:linear-gradient(90deg,#7b31ff,#d32cc9);background-size:200% 100%;animation:gradientShift 5s linear infinite}@keyframes gradientShift{to{background-position:200% 0}}
@media(hover:hover){.card.clickable:hover,.member-row.clickable:hover{border-color:rgba(155,52,255,.45);box-shadow:0 8px 30px rgba(155,52,255,.08);transform:translateY(-1px)}.btn:hover{border-color:rgba(155,52,255,.55)}}
@media(max-width:560px){.projects-grid{grid-template-columns:1fr}.project-card{min-height:auto}.value-row{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}



/* V1.4 premium visual FX */
:root{--fxX:0px;--fxY:0px;--heroShift:0px}
html{background:#050507}
body{overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(34px);opacity:.30;will-change:transform}
body:before{width:280px;height:280px;left:-120px;top:12vh;background:radial-gradient(circle,rgba(126,43,255,.38),rgba(126,43,255,0) 70%);animation:auroraFloatA 13s ease-in-out infinite alternate}
body:after{width:330px;height:330px;right:-155px;top:47vh;background:radial-gradient(circle,rgba(211,44,201,.25),rgba(211,44,201,0) 72%);animation:auroraFloatB 17s ease-in-out infinite alternate}
.app{isolation:isolate;z-index:1}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.19;background-image:radial-gradient(circle at 20% 18%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),radial-gradient(circle at 72% 36%,rgba(184,94,255,.8) 0 1px,transparent 1.6px),radial-gradient(circle at 42% 73%,rgba(255,255,255,.4) 0 .8px,transparent 1.4px);background-size:170px 170px,230px 230px,300px 300px;animation:starDrift 34s linear infinite}
@keyframes auroraFloatA{from{transform:translate3d(-2%,0,0) scale(.9)}to{transform:translate3d(24%,16%,0) scale(1.12)}}
@keyframes auroraFloatB{from{transform:translate3d(0,8%,0) scale(.92)}to{transform:translate3d(-22%,-12%,0) scale(1.1)}}
@keyframes starDrift{to{background-position:170px 90px,-230px 130px,300px -150px}}

/* logo / brand breath */
.wordmark{position:relative;isolation:isolate;overflow:visible}
.wordmark:before{content:"";position:absolute;left:50%;top:43%;width:116px;height:58px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(159,52,255,.27),rgba(159,52,255,0) 68%);filter:blur(8px);z-index:-1;animation:brandHalo 3.2s ease-in-out infinite}
.wordmark:after{content:"";position:absolute;left:50%;bottom:14px;width:54px;height:2px;transform:translateX(-50%) scaleX(.75);border-radius:999px;background:linear-gradient(90deg,transparent,#963dff,#e333cf,transparent);box-shadow:0 0 12px rgba(179,54,255,.8);animation:brandLine 2.7s ease-in-out infinite}
.wordmark .brush{transform-origin:center;animation:logoBreath 3.2s ease-in-out infinite;will-change:transform,filter;text-shadow:0 0 10px rgba(255,255,255,.10),0 0 22px rgba(155,52,255,.10)}
.wordmark .brush em{display:inline-block;animation:accentSpark 2.2s ease-in-out infinite}
@keyframes logoBreath{0%,100%{transform:rotate(-3deg) scale(1);filter:drop-shadow(0 0 0 rgba(155,52,255,0))}50%{transform:rotate(-3deg) scale(1.035);filter:drop-shadow(0 0 11px rgba(155,52,255,.35))}}
@keyframes brandHalo{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.88)}50%{opacity:.92;transform:translate(-50%,-50%) scale(1.12)}}
@keyframes brandLine{0%,100%{opacity:.45;transform:translateX(-50%) scaleX(.6)}50%{opacity:1;transform:translateX(-50%) scaleX(1.25)}}
@keyframes accentSpark{0%,100%{color:#9b34ff;text-shadow:0 0 4px rgba(155,52,255,.3)}50%{color:#ec4ad8;text-shadow:0 0 16px rgba(224,63,214,.85)}}

/* glass / depth */
.top{backdrop-filter:blur(16px) saturate(118%);-webkit-backdrop-filter:blur(16px) saturate(118%)}
.card{position:relative;isolation:isolate}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.045),transparent 24%,transparent 70%,rgba(154,52,255,.035));opacity:.75;z-index:-1}
.card.clickable,.event-card,.project-card,.media-hub,.welcome-card{will-change:transform}
.card.clickable:active,.event-card:active,.project-card:active{transform:scale(.987) translateY(1px)}

/* hero cinematic sweep */
.hero-event{background-position:center calc(50% + var(--heroShift));box-shadow:0 20px 60px rgba(0,0,0,.32),0 0 0 1px rgba(155,52,255,.04) inset}
.hero-event:before{content:"";position:absolute;inset:-30% -70%;z-index:1;pointer-events:none;background:linear-gradient(104deg,transparent 40%,rgba(255,255,255,.02) 46%,rgba(197,79,255,.16) 50%,rgba(255,255,255,.025) 54%,transparent 60%);transform:translateX(-38%);animation:heroSweep 7.5s cubic-bezier(.4,0,.2,1) infinite}
.hero-copy,.dots{position:relative;z-index:2}
.hero-copy h2{text-shadow:0 3px 20px rgba(0,0,0,.65),0 0 24px rgba(155,52,255,.08)}
@keyframes heroSweep{0%,55%{transform:translateX(-42%);opacity:0}66%{opacity:.75}88%,100%{transform:translateX(42%);opacity:0}}

/* staggered page reveals */
.view.fx-enter> *{animation:fxReveal .46s cubic-bezier(.17,.78,.24,1) backwards}
.view.fx-enter> *:nth-child(1){animation-delay:.015s}.view.fx-enter> *:nth-child(2){animation-delay:.055s}.view.fx-enter> *:nth-child(3){animation-delay:.095s}.view.fx-enter> *:nth-child(4){animation-delay:.135s}.view.fx-enter> *:nth-child(5){animation-delay:.175s}.view.fx-enter> *:nth-child(6){animation-delay:.215s}.view.fx-enter> *:nth-child(n+7){animation-delay:.24s}
@keyframes fxReveal{from{opacity:0;transform:translate3d(0,13px,0) scale(.992);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}

/* buttons */
.btn.primary{position:relative;overflow:hidden;isolation:isolate;background-size:160% 160%;animation:primaryGradient 6s ease infinite}
.btn.primary:after{content:"";position:absolute;inset:-2px auto -2px -55%;width:42%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);animation:buttonShine 4.8s ease-in-out infinite;pointer-events:none}
@keyframes primaryGradient{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes buttonShine{0%,65%{left:-55%;opacity:0}72%{opacity:.7}88%,100%{left:125%;opacity:0}}

/* notification attention */
#notifBtn.has-unread{border-color:rgba(155,52,255,.48);box-shadow:0 0 22px rgba(155,52,255,.12)}
#notifBtn.has-unread #bellIcon{display:inline-grid;transform-origin:50% 10%;animation:bellAttention 5.8s ease-in-out infinite}
#notifBtn.has-unread .badge{animation:badgeBreathe 1.8s ease-in-out infinite}
@keyframes bellAttention{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(11deg)}88%{transform:rotate(-10deg)}91%{transform:rotate(7deg)}94%{transform:rotate(-5deg)}97%{transform:rotate(0)}}
@keyframes badgeBreathe{0%,100%{box-shadow:0 0 0 0 rgba(178,58,255,.4);transform:scale(1)}50%{box-shadow:0 0 0 5px rgba(178,58,255,0);transform:scale(1.07)}}

/* nav dock */
.bottom{box-shadow:0 -18px 42px rgba(0,0,0,.35);overflow:visible}
.navbtn{position:relative;border-radius:13px;overflow:visible}
.navbtn:before{content:"";position:absolute;left:50%;top:3px;width:44px;height:34px;transform:translateX(-50%) scale(.6);border-radius:14px;background:radial-gradient(circle,rgba(155,52,255,.24),rgba(155,52,255,0) 72%);opacity:0;transition:.25s ease;pointer-events:none}
.navbtn.active:before{opacity:1;transform:translateX(-50%) scale(1);animation:navAura 2.8s ease-in-out infinite}
.navbtn.active svg{animation:navIconPop .38s cubic-bezier(.2,1.5,.35,1),navIconBreath 3.2s .4s ease-in-out infinite}
@keyframes navIconPop{from{transform:scale(.72) translateY(4px)}to{transform:none}}
@keyframes navIconBreath{0%,100%{filter:drop-shadow(0 0 7px rgba(155,52,255,.55))}50%{filter:drop-shadow(0 0 13px rgba(196,72,255,.9))}}
@keyframes navAura{0%,100%{opacity:.55;transform:translateX(-50%) scale(.92)}50%{opacity:1;transform:translateX(-50%) scale(1.1)}}

/* status / community */
.new-badge{animation:newBadgePulse 2.2s ease-in-out infinite;box-shadow:0 0 14px rgba(155,52,255,.20)}
@keyframes newBadgePulse{0%,100%{transform:scale(1);filter:saturate(1)}50%{transform:scale(1.045);filter:saturate(1.35)}}
.project-status{gap:5px}
.project-status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;opacity:.9}
.project-status.live:before{animation:statusPulse 1.55s ease-out infinite}
.project-status.work:before{animation:statusBlink 1.8s ease-in-out infinite}
@keyframes statusPulse{0%{box-shadow:0 0 0 0 currentColor}75%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes statusBlink{0%,100%{opacity:.35}50%{opacity:1}}
.onboard-progress i{position:relative;overflow:hidden;box-shadow:0 0 12px rgba(155,52,255,.35)}
.onboard-progress i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:progressSweep 2.5s ease-in-out infinite}
@keyframes progressSweep{0%,35%{transform:translateX(-100%)}75%,100%{transform:translateX(100%)}}

/* live = radar feeling */
#liveMap{position:relative;box-shadow:0 0 0 1px rgba(155,52,255,.08),0 18px 40px rgba(0,0,0,.35)}
#liveMap:after{content:"";position:absolute;left:50%;top:50%;width:160px;height:160px;transform:translate(-50%,-50%) scale(.45);border:1px solid rgba(155,52,255,.32);border-radius:50%;box-shadow:0 0 0 16px rgba(155,52,255,.05),0 0 0 34px rgba(155,52,255,.025);opacity:0;z-index:401;pointer-events:none;animation:mapRadar 4s ease-out infinite}
@keyframes mapRadar{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:.65}70%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}
.leaflet-marker-icon{filter:drop-shadow(0 0 7px rgba(155,52,255,.7))}
.live-summary{position:relative;overflow:hidden;border-color:rgba(155,52,255,.32)}
.live-summary:after{content:"";position:absolute;left:-30%;top:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(155,52,255,.10),transparent);animation:liveSweep 4.2s linear infinite;pointer-events:none}
.eta-card{animation:etaGlow 3.4s ease-in-out infinite}
@keyframes liveSweep{to{left:120%}}
@keyframes etaGlow{0%,100%{box-shadow:0 0 15px rgba(155,52,255,.10)}50%{box-shadow:0 0 30px rgba(155,52,255,.24)}}

/* admin telemetry */
.admin-kpi{position:relative;overflow:hidden}
.admin-kpi:after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(155,52,255,.8),transparent);transform:scaleX(.25);opacity:.45;animation:kpiLine 3s ease-in-out infinite}
.admin-kpi b.fx-counting{text-shadow:0 0 16px rgba(155,52,255,.48)}
@keyframes kpiLine{0%,100%{transform:scaleX(.25);opacity:.25}50%{transform:scaleX(1);opacity:.9}}

/* modal & toast motion */
.modal.show .sheet{animation:sheetIn .38s cubic-bezier(.16,.85,.2,1)}
@keyframes sheetIn{from{transform:translateY(32px);opacity:.4}to{transform:none;opacity:1}}
.toast.show{box-shadow:0 10px 35px rgba(0,0,0,.35),0 0 20px rgba(155,52,255,.08)}

@media(max-width:430px){body:before{opacity:.20}.app:before{opacity:.12}.hero-event:before{animation-duration:9s}.wordmark:before{width:100px}}
@media(prefers-reduced-motion:reduce){body:before,body:after,.app:before{display:none!important}.wordmark:before,.wordmark:after,#liveMap:after{display:none!important}}



/* V1.4.1 mobile polish + carousel + live pins */
.hero-event .dots{position:absolute!important;left:50%!important;right:auto!important;bottom:14px!important;transform:translateX(-50%)!important;display:flex!important;align-items:center;justify-content:center;gap:9px;z-index:5!important;padding:8px 12px;border-radius:999px;background:rgba(3,3,6,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero-dot{appearance:none;-webkit-appearance:none;width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#77747f;box-shadow:none;transition:width .24s ease,background .24s ease,box-shadow .24s ease;touch-action:manipulation}
.hero-dot.active{width:24px;border-radius:999px;background:linear-gradient(90deg,#8f31ff,#dc35d3);box-shadow:0 0 14px rgba(169,56,255,.55)}
.hero-copy-swap{animation:heroCopySwap .34s cubic-bezier(.2,.8,.25,1)}
@keyframes heroCopySwap{from{opacity:.25;transform:translate3d(14px,0,0)}to{opacity:1;transform:none}}
.hero-event{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.live-user-marker,.live-target-marker{background:transparent!important;border:0!important}
.live-pin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:relative;border:2px solid #fff;box-shadow:0 0 0 5px rgba(155,52,255,.18),0 0 22px rgba(155,52,255,.75);font-size:15px;font-weight:900}
.user-pin{background:linear-gradient(135deg,#7c2cff,#d938d0)}
.user-pin i{width:8px;height:8px;border-radius:50%;background:white;display:block;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:userPinPulse 1.7s ease-out infinite}
.target-pin{background:linear-gradient(135deg,#168753,#32da83);box-shadow:0 0 0 5px rgba(50,218,131,.15),0 0 22px rgba(50,218,131,.55)}
@keyframes userPinPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

@media(max-width:640px){
  .view{padding-left:14px;padding-right:14px}
  .page-title{margin-top:2px;margin-bottom:14px}
  .page-title h1{font-size:clamp(30px,9vw,38px);line-height:.94;letter-spacing:.2px}
  .kicker{font-size:7.5px;letter-spacing:3.1px;line-height:1.45}
  .tabs{grid-auto-flow:unset;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:13px;margin-bottom:14px}
  .tabs button{min-width:0;padding:12px 5px;font-size:11.5px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
  .event-card{border-radius:16px;margin-bottom:16px}
  .event-main{display:grid;grid-template-columns:1fr}
  .event-cover{height:190px;min-height:0;background-position:center 48%;border-bottom:1px solid var(--line)}
  .event-content{padding:15px 15px 16px}
  .event-content h3{font-size:27px;line-height:1.02;margin:5px 0 5px}
  .event-content>.muted.tiny{font-size:11px;line-height:1.4}
  .facts{gap:9px;margin-top:13px}
  .fact{font-size:13px;line-height:1.35;min-width:0}
  .fact span,.fact div{min-width:0;overflow-wrap:anywhere}
  .event-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
  .event-actions .btn{min-width:0;width:100%;padding:10px 4px;font-size:10.8px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .route-mini{grid-template-columns:1fr;gap:8px;padding:12px 14px 14px}
  .route-mini .btn{width:100%;min-width:0}
  .arrival-row{align-items:flex-start;flex-wrap:wrap}
  .arrival-row span{width:100%;margin-left:36px;margin-top:-4px}
  .event-teaser{grid-template-columns:1fr}
  .event-teaser .cover{min-height:135px;background-position:center 55%}
  .event-teaser .content{padding:14px}
  .hero-event{min-height:390px}
  .hero-copy{padding:28px 24px 52px}
  .hero-copy h2{font-size:clamp(42px,12.2vw,58px);line-height:.86;max-width:92%}
  .hero-copy .facts{max-width:92%}
  .map{height:min(58vh,430px)}
  .live-actions{gap:8px}
  .live-actions .btn{min-width:0;padding-left:8px;padding-right:8px;font-size:12px}
}
@media(max-width:380px){
  .view{padding-left:11px;padding-right:11px}
  .tabs button{font-size:10.5px;padding-left:3px;padding-right:3px}
  .event-cover{height:170px}
  .event-actions .btn{font-size:10px;padding-left:2px;padding-right:2px}
  .event-content h3{font-size:25px}
  .hero-copy{padding-left:20px;padding-right:20px}
  .bottom{padding-left:4px;padding-right:4px}
  .navbtn{font-size:9.5px}
}



/* V2.0 Grande Finale */
.empty-state{padding:28px 18px;text-align:center;display:grid;place-items:center;gap:7px;color:var(--muted)}
.empty-state b{color:var(--text);font-size:16px}.empty-state span{font-size:11px;max-width:360px;line-height:1.5}.empty-icon{font-size:30px;color:#b34dff}
.final-gallery-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:visible;padding:4px;background:rgba(13,13,18,.92);border:1px solid var(--line);border-radius:14px;position:sticky;top:8px;z-index:7;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.final-gallery-tabs button{border:0;background:transparent;color:#aaa6b2;border-radius:10px;min-height:42px;font-weight:800;font-size:11px;transition:.22s ease}.final-gallery-tabs button.active{background:linear-gradient(135deg,#772aff,#c333d6);color:white;box-shadow:0 0 20px rgba(155,52,255,.25)}

/* V3 production auth, sync & release states */
body.auth-mode .bottom,body.auth-mode .fab,body.auth-mode #notifBtn,body.auth-mode #profileBtn{display:none!important}

.auth-shell{min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center;padding:24px 0 60px}
.auth-card{width:min(100%,520px);padding:22px;border:1px solid rgba(164,69,255,.32);background:linear-gradient(150deg,rgba(24,17,31,.97),rgba(9,9,13,.98));box-shadow:0 26px 90px rgba(0,0,0,.55),0 0 45px rgba(155,52,255,.08);border-radius:24px;position:relative;overflow:hidden}

.auth-brand{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:38px;font-weight:800;line-height:.92;margin:8px 0 4px}.auth-brand span{color:var(--purple)}
.auth-sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:20px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#09090d;border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.auth-tabs button{border:0;background:transparent;color:var(--muted);font-weight:800;padding:11px;border-radius:10px}.auth-tabs button.active{background:linear-gradient(135deg,var(--purple3),var(--purple));color:#fff;box-shadow:var(--glow)}
.auth-note{padding:11px 13px;border:1px solid rgba(155,52,255,.28);background:rgba(155,52,255,.08);border-radius:13px;color:#d7cfdf;font-size:12px;line-height:1.5;margin:12px 0}.auth-error{border-color:rgba(255,77,94,.35);background:rgba(255,77,94,.08);color:#ffd8dd}.auth-ok{border-color:rgba(50,218,131,.35);background:rgba(50,218,131,.08);color:#d7ffe9}
.auth-link{border:0;background:transparent;color:#c47cff;font-weight:800;padding:8px 0;cursor:pointer}.auth-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.server-pill{display:inline-flex;gap:7px;align-items:center;font-size:11px;font-weight:800;color:#a9f7ce}.server-pill i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(50,218,131,.75)}

.invite-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.04em;word-break:break-all}.release-danger{border-color:rgba(255,77,94,.4)!important;background:rgba(255,77,94,.08)!important}.feedback-list{display:grid;gap:8px}.feedback-card{padding:11px;border:1px solid var(--line);border-radius:13px;background:#0c0c11}.feedback-card span{display:block;color:var(--muted);font-size:11px;margin-top:4px}

/* PWA opening animation */
body.launch-active{overflow:hidden}
.launch-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(133,51,255,.18),transparent 34%),radial-gradient(circle at 50% 78%,rgba(211,44,201,.12),transparent 28%),#050507;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s ease;overflow:hidden}
.launch-screen.show{opacity:1;visibility:visible}
.launch-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.launch-screen:before,.launch-screen:after{content:"";position:absolute;inset:auto;filter:blur(75px);pointer-events:none}
.launch-screen:before{width:360px;height:360px;border-radius:50%;background:rgba(129,45,255,.18);top:-110px;left:50%;transform:translateX(-50%);animation:launchGlow 5s ease-in-out infinite}
.launch-screen:after{width:72vw;height:220px;left:50%;bottom:-90px;transform:translateX(-50%);background:radial-gradient(circle,rgba(181,70,255,.18),rgba(181,70,255,0) 70%);animation:launchFloor 4.8s ease-in-out infinite}
.launch-noise,.launch-smoke{position:absolute;inset:0;pointer-events:none}
.launch-noise{opacity:.17;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.12) 0 1px,transparent 1.6px),radial-gradient(circle at 72% 28%,rgba(255,255,255,.08) 0 1px,transparent 1.6px),radial-gradient(circle at 34% 76%,rgba(255,255,255,.10) 0 1px,transparent 1.6px),radial-gradient(circle at 80% 80%,rgba(255,255,255,.08) 0 1px,transparent 1.6px);background-size:240px 240px,280px 280px,320px 320px,360px 360px}
.launch-smoke:before,.launch-smoke:after{content:"";position:absolute;left:50%;bottom:9vh;width:min(90vw,700px);height:220px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(188,100,255,.18),rgba(112,30,180,.11) 28%,rgba(20,12,30,0) 72%);filter:blur(28px);animation:launchSmoke 4.4s ease-in-out infinite}
.launch-smoke:after{width:min(72vw,520px);height:160px;bottom:16vh;opacity:.72;animation-duration:5.6s;animation-direction:alternate}
.launch-core{position:relative;z-index:2;width:min(92vw,430px);padding:28px 20px 22px;text-align:center}
.launch-core:before{content:"";position:absolute;inset:22px 10px;border-radius:28px;border:1px solid rgba(155,52,255,.14);background:linear-gradient(180deg,rgba(17,16,23,.30),rgba(6,6,10,.05));box-shadow:0 0 0 1px rgba(255,255,255,.02) inset}
.launch-crown{position:relative;z-index:1;margin:0 auto 10px;width:74px;height:54px;display:grid;place-items:center;filter:drop-shadow(0 0 18px rgba(191,90,255,.48));animation:launchCrown 1.55s cubic-bezier(.16,.88,.3,1) .35s both}
.launch-crown svg{width:100%;height:100%;stroke:#d05cff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.launch-logo{position:relative;z-index:1;line-height:.84;text-transform:uppercase;transform:translateY(8px);opacity:0;animation:launchLogo .8s cubic-bezier(.18,.9,.25,1) .16s forwards}
.launch-logo span,.launch-logo b{display:block;font-family:"Permanent Marker",cursive;font-size:40px;text-shadow:0 0 22px rgba(255,255,255,.08),0 0 34px rgba(155,52,255,.24)}
.launch-logo b{color:#ce59ff}
.launch-logo small{display:block;margin-top:13px;font-family:Inter,sans-serif;font-size:10px;font-weight:800;letter-spacing:5px;color:#b7b2bf;text-transform:uppercase}
.launch-manifesto{margin:14px auto 0;font-size:8px;font-weight:800;letter-spacing:4px;line-height:1.8;color:#eceaf3;opacity:.72;max-width:220px}
.launch-car{position:relative;z-index:1;width:min(72vw,315px);height:116px;margin:18px auto 14px;opacity:0;transform:translateY(20px) scale(.94);animation:launchCar 1s cubic-bezier(.18,.9,.25,1) .56s forwards}
.launch-car:before{content:"";position:absolute;left:50%;bottom:8px;width:64%;height:18px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(175,75,255,.52),rgba(175,75,255,0) 72%);filter:blur(12px);animation:launchFloorGlow 3.2s ease-in-out infinite}
.launch-car .car-shell{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:84%;height:72px;background:linear-gradient(180deg,#101015,#050507);clip-path:polygon(10% 100%,15% 62%,28% 44%,38% 26%,62% 26%,72% 44%,85% 62%,90% 100%,73% 100%,69% 78%,31% 78%,27% 100%);box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 26px rgba(130,44,255,.11)}
.launch-car .car-shell:before{content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);width:24%;height:24px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#171720,#0c0c12);opacity:.9}
.launch-car .headlight{position:absolute;top:34px;width:56px;height:15px;border-radius:16px;background:linear-gradient(90deg,rgba(180,90,255,.05),rgba(223,115,255,.96),rgba(180,90,255,.05));box-shadow:0 0 18px rgba(208,92,255,.8),0 0 38px rgba(208,92,255,.38);animation:headlightPulse 2.5s ease-in-out infinite}
.launch-car .headlight.left{left:22px;transform:skewX(-18deg)}
.launch-car .headlight.right{right:22px;transform:skewX(18deg)}
.launch-progress{position:relative;z-index:1;width:min(76vw,255px);height:8px;margin:2px auto 10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 0 12px rgba(120,42,255,.18)}
.launch-progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#7b2bff,#bb44ff,#e24bd2);box-shadow:0 0 18px rgba(188,68,255,.55);transition:width .45s ease}
.launch-progress i:after{content:"";position:absolute;top:0;bottom:0;right:-18px;width:40px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.48),rgba(255,255,255,0));transform:skewX(-25deg);animation:launchSweep 2.2s linear infinite}
.launch-status{position:relative;z-index:1;font-size:11px;letter-spacing:3px;font-weight:800;text-transform:uppercase;color:#c8c3d1;min-height:14px}
@keyframes launchGlow{0%,100%{transform:translateX(-50%) scale(.96);opacity:.72}50%{transform:translateX(-50%) scale(1.05);opacity:1}}
@keyframes launchFloor{0%,100%{opacity:.55;transform:translateX(-50%) scale(.94)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
@keyframes launchSmoke{0%,100%{transform:translateX(-50%) translateY(0) scale(.95);opacity:.42}50%{transform:translateX(-50%) translateY(-12px) scale(1.02);opacity:.7}}
@keyframes launchLogo{to{opacity:1;transform:none}}
@keyframes launchCrown{0%{opacity:0;transform:translateY(10px) scale(.76)}70%{opacity:1;transform:translateY(-2px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes launchCar{to{opacity:1;transform:none}}
@keyframes launchFloorGlow{0%,100%{opacity:.5;transform:translateX(-50%) scale(.95)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
@keyframes headlightPulse{0%,100%{opacity:.8}50%{opacity:1;box-shadow:0 0 22px rgba(208,92,255,.95),0 0 48px rgba(208,92,255,.44)}}
@keyframes launchSweep{0%{transform:translateX(-90px) skewX(-25deg)}100%{transform:translateX(285px) skewX(-25deg)}}
@media(max-width:430px){.launch-logo span,.launch-logo b{font-size:34px}.launch-logo small{letter-spacing:4px;font-size:9px}.launch-car{height:104px}.launch-car .headlight{top:31px;width:48px}.launch-manifesto{font-size:7px}}

.launch-core:after{content:"";position:absolute;left:50%;top:51%;width:420px;height:420px;transform:translate(-50%,-50%) scale(.45);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(166,65,255,.20) 0 1.5deg,transparent 1.5deg 10deg);filter:blur(.2px);opacity:0;animation:launchImpactRays 2.5s cubic-bezier(.18,.9,.25,1) .8s both;pointer-events:none}
.launch-car{filter:drop-shadow(0 0 24px rgba(143,54,255,.18))}
@keyframes launchImpactRays{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-8deg)}36%{opacity:.55}70%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.15) rotate(8deg)}}

.launch-screen{background:radial-gradient(ellipse at 50% 108%,rgba(139,45,255,.25),transparent 38%),radial-gradient(circle at 50% 22%,rgba(114,32,197,.17),transparent 27%),linear-gradient(180deg,#030305 0%,#07070b 55%,#030305 100%)}
.launch-screen .launch-core{width:min(96vw,520px);padding:22px 20px 18px}
.launch-screen .launch-core:before{inset:6px -2px;border-color:rgba(176,79,255,.13);background:linear-gradient(180deg,rgba(20,13,29,.34),rgba(4,4,7,.08));box-shadow:0 22px 90px rgba(0,0,0,.55),0 0 80px rgba(126,40,255,.06) inset}
.launch-screen .launch-logo span,.launch-screen .launch-logo b{font-size:clamp(34px,9vw,48px);letter-spacing:-1px}
.launch-screen .launch-logo b{background:linear-gradient(90deg,#9f33ff,#e071ff,#ad3fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(186,73,255,.28))}
.launch-screen .launch-logo small{font-size:9px;letter-spacing:5px}

@keyframes lampIgnition{0%{opacity:.08;filter:drop-shadow(0 0 0 rgba(204,90,255,0))}24%{opacity:1;filter:brightness(2.1) drop-shadow(0 0 16px rgba(222,110,255,1))}45%{opacity:.6}100%{opacity:1;filter:brightness(1.25) drop-shadow(0 0 9px rgba(204,90,255,.8))}}
@keyframes auraIgnition{0%{opacity:0}28%{opacity:.62}100%{opacity:.21}}@keyframes groundIgnition{0%{opacity:.05;transform:scaleX(.7)}38%{opacity:.48;transform:scaleX(1.15)}100%{opacity:.24;transform:scaleX(1)}}@keyframes beamIgnition{0%{opacity:0;transform:scaleX(.35)}32%{opacity:.75}100%{opacity:.12}}

const launchFX={startedAt:performance.now(),minDuration:2400,done:false,el:null,bar:null,status:null};
function initLaunchScreen(){
  if(launchFX.el)return;
  launchFX.el=$('#launchScreen');
  launchFX.bar=$('#launchProgressFill');
  launchFX.status=$('#launchStatus');
  if(!launchFX.el)return;
  document.body.classList.add('launch-active');
  requestAnimationFrame(()=>launchFX.el.classList.add('show'));
  requestAnimationFrame(()=>advanceLaunchProgress(16,'System startet…'));
  setTimeout(()=>{if(!launchFX.done)advanceLaunchProgress(38,'Sichere Verbindung…')},360);
  setTimeout(()=>{if(!launchFX.done)advanceLaunchProgress(62,'Crew-Module werden geladen…')},1080);
}
function setLaunchStatus(text){if(launchFX.status&&text)launchFX.status.textContent=text}
function advanceLaunchProgress(value,text=''){if(launchFX.bar)launchFX.bar.style.width=Math.max(0,Math.min(100,value))+'%';if(text)setLaunchStatus(text)}
function finishLaunchScreen(text='App bereit'){if(launchFX.done)return;launchFX.done=true;advanceLaunchProgress(100,text);const wait=Math.max(0,launchFX.minDuration-(performance.now()-launchFX.startedAt));setTimeout(()=>{if(!launchFX.el)return;launchFX.el.classList.add('hidden');document.body.classList.remove('launch-active');setTimeout(()=>launchFX.el?.remove(),760)},wait+180)}

let fxRaf=0;
function animateFxCounters(){
  $$('.stat b,.admin-kpi b').forEach(el=>{
    const raw=(el.textContent||'').trim();
    if(!/^\d+$/.test(raw))return;
    const target=Number(raw);if(target<=0)return;
    const dur=Math.min(850,420+target*3),start=performance.now();
    el.classList.add('fx-counting');
    const step=now=>{const p=Math.min(1,(now-start)/dur),ease=1-Math.pow(1-p,3);el.textContent=Math.round(target*ease);if(p<1)requestAnimationFrame(step);else{el.textContent=target;setTimeout(()=>el.classList.remove('fx-counting'),250)}};
    requestAnimationFrame(step);
  });
}
function runVisualFX(){
  const v=$('#view');if(!v)return;
  v.classList.remove('fx-enter');void v.offsetWidth;v.classList.add('fx-enter');
  animateFxCounters();
}

  const applyScroll=()=>{fxRaf=0;const y=Math.max(-16,Math.min(16,window.scrollY*.035));document.documentElement.style.setProperty('--heroShift',`${y}px`)};
  window.addEventListener('scroll',()=>{if(!fxRaf)fxRaf=requestAnimationFrame(applyScroll)},{passive:true});

}

function openEventDetail(id){const e=state.events.find(x=>x.id===id);if(!e)return;const stops=(e.stops||[]).map((s,i)=>`<div class="card pad"><div class="eyebrow">${i===0?'Treffpunkt':i===e.stops.length-1?'Ziel':'Stopp '+i}</div><b>${esc(s[1])}</b></div>`).join('');openModal(e.name,`<div class="card pad"><div class="eyebrow">${esc(e.type)}</div><h3 style="font-size:24px;margin:6px 0">${esc(e.name)}</h3>${fact('calendar',e.date)}${fact('clock',e.time+' Uhr')}${fact('pin',e.place)}</div>${e.lat?`<div id="eventMap" class="map" style="height:250px;margin-top:10px"></div><div class="actions"><button class="btn outline" id="navigateEvent">${I('route')} Navigation</button><button class="btn primary" id="arrivalEvent">${I('car')} Ankunft teilen</button></div><div class="actions"><button class="btn outline" id="calendarEvent">${I('calendar')} Kalender</button><button class="btn outline" id="shareEventBtn">Teilen</button></div>`:''}${stops?`<div class="section"><div class="sectionhead"><h2>Route & Infos</h2></div><div class="list">${stops}</div></div>`:''}`,()=>{if(e.lat){modalMap=L.map('eventMap').setView([e.lat,e.lng],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(modalMap);L.marker([e.lat,e.lng]).addTo(modalMap).bindPopup(e.name);$('#navigateEvent').onclick=()=>openMapsChoice(e.lat,e.lng,e.place);$('#arrivalEvent').onclick=()=>shareArrival('event',e.id);$('#calendarEvent').onclick=()=>downloadICS(e);$('#shareEventBtn').onclick=()=>shareEvent(e)}})}

function memberRows(adminMode=false,q=''){return state.users.filter(u=>!q||`${u.name} ${u.car} ${u.ig} ${(u.labels||[]).join(' ')}`.toLowerCase().includes(q)).map(u=>`<div class="card member-row clickable" ${adminMode?`data-admin-member="${u.id}"`:`data-member-detail="${u.id}"`}><div class="avatar">${u.emoji||'🚗'}</div><div class="member-info"><b>${esc(u.name)} ${u.role==='owner'?'♛':''}</b><span>${esc(u.ig||'')} · ${esc(u.car||'')}</span>${u.bio?`<div class="member-bio">${esc(u.bio)}</div>`:''}<div class="member-tags">${(u.labels||[]).map(l=>`<span class="label function">${esc(l)}</span>`).join('')}</div></div><div class="member-right"><span class="label ${u.role}">${roleLabel(u.role)}</span>${u.role==='owner'?`<span class="tiny muted">🔒 geschützt</span>`:''}</div></div>`).join('')}

function openMemberDetail(id){const u=state.users.find(x=>x.id===id);if(!u)return;openModal(u.name,`<div class="card member-row"><div class="avatar">${u.emoji||'🚗'}</div><div class="member-info"><b>${esc(u.name)}</b><span>${esc(u.ig||'')} · ${esc(u.car||'')}</span><div class="member-tags">${(u.labels||[]).map(l=>`<span class="label function">${esc(l)}</span>`).join('')}</div></div><span class="label ${u.role}">${roleLabel(u.role)}</span></div><div class="card pad" style="margin-top:10px"><div class="eyebrow">Über mich</div><p class="small" style="line-height:1.6">${esc(u.bio||'Noch keine Beschreibung hinterlegt.')}</p><div class="muted tiny">Dabei seit ${formatJoined(u.joinedAt)}</div></div>${u.id===me().id?`<button class="btn primary wide" id="editOwnProfile" style="margin-top:10px">Profil bearbeiten</button>`:''}`,()=>$('#editOwnProfile')?.addEventListener('click',()=>{closeModal();openProfileEditor()}))}
function formatJoined(v){if(!v)return'—';try{return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(v+'T12:00:00'))}catch{return v}}

${section('Media & Crew Film',`<div class="card media-hub clickable" id="galleryMedia"><div class="eyebrow">${esc(state.media?.crewFilmStatus||'Vorbereitung')}</div><h3 style="margin:5px 0">🎬 ${esc(state.media?.crewFilmTitle||'Crew Film')}</h3><div class="muted small">Clips, Crew-Film und später der direkte Weg zu YouTube.</div><div class="media-links"><button class="btn outline sm">Media Hub öffnen</button></div></div>`)}
${section('Mein Fahrzeug',`<div class="card vehicle-card final-vehicle-card"><div class="vehicle-photo"></div><div class="vehicle-info"><div class="eyebrow">Mein Fahrzeug</div><h3>${esc(me().car||'Noch kein Fahrzeug')}</h3><div class="muted tiny">${esc(me().name)} · ${esc(me().status||'Crew Member')}</div><div class="vehicle-specs"><div><span>Profil</span><b>${esc(me().name)}</b></div><div><span>Rolle</span><b>${roleLabel(me().role)}</b></div></div><button class="btn outline sm" id="galleryProfile">Profil öffnen</button></div></div>`)}`;$$('[data-gallery-filter]').forEach(b=>b.onclick=()=>{galleryView=b.dataset.galleryFilter;renderGallery()});$$('[data-gallery-event]').forEach(b=>b.onclick=()=>openEventDetail(b.dataset.galleryEvent));$$('[data-member-detail]').forEach(b=>b.onclick=()=>openMemberDetail(b.dataset.memberDetail));$$('[data-gallery-photo]').forEach((b,i)=>b.onclick=()=>openPhotoViewer(filtered[i]));$('#photoInput').onchange=e=>handlePhotos(e.target.files);$('#galleryMedia').onclick=openMediaHub;$('#galleryProfile').onclick=()=>{page='profile';render()}}
function handlePhotos(files){[...files].slice(0,8).forEach(f=>{if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(f.type)||f.size>12*1024*1024){toast('Nur Bilder bis 12 MB');return}const r=new FileReader();r.onload=()=>{state.photos.unshift({data:r.result,label:'Crew Upload',kind:'crew',createdAt:Date.now()});state.photos=state.photos.slice(0,20);save();renderGallery()};r.readAsDataURL(f)})}

function openMemberAdmin(id){const u=state.users.find(x=>x.id===id);if(!u)return;const owner=u.role==='owner';const labelOptions=(state.customLabels||[]).map(l=>`<button class="chip ${(u.labels||[]).includes(l)?'active':''}" data-label="${esc(l)}">${esc(l)}</button>`).join('');openModal(u.name,`<div class="card pad"><b>${esc(u.name)}</b><div class="muted small">${esc(u.car)} · ${esc(u.ig)}</div></div>${owner?'<div class="notice">🔒 Owner kann nicht verändert, gelöscht oder herabgestuft werden.</div>':`${isOwner()?`<div class="field"><label>Rolle</label><select id="roleSel"><option value="member" ${u.role==='member'?'selected':''}>Mitglied</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div>`:''}<div class="field"><label>Funktions-Labels</label><div class="chips" id="labelChoices">${labelOptions}</div></div>${isOwner()?'<button class="btn primary wide" id="saveMember">Speichern</button><button class="btn bad wide" id="removeMember" style="margin-top:8px">Mitglied entfernen</button>':'<div class="notice">Rollen und Admin-Labels können nur vom Owner geändert werden.</div>'}`}`,()=>{if(owner||!isOwner())return;let labels=[...(u.labels||[])];$$('#labelChoices [data-label]').forEach(b=>b.onclick=()=>{const l=b.dataset.label;labels=labels.includes(l)?labels.filter(x=>x!==l):[...labels,l];b.classList.toggle('active')});$('#saveMember').onclick=()=>{u.role=$('#roleSel').value;u.labels=u.role==='admin'?labels:[];state.audit.unshift(`${me().name} änderte ${u.name}`);save();closeModal();openMemberManagement()};$('#removeMember').onclick=()=>{state.users=state.users.filter(x=>x.id!==u.id);state.audit.unshift(`${me().name} entfernte ${u.name}`);save();closeModal();openMemberManagement()}})}

function openAnnouncementDetail(id){const a=state.announcements.find(x=>x.id===id);if(!a)return;markRead(id);const current=myResponse(a);const arrivals=Object.entries(a.arrivals||{}).map(([uid,x])=>{const u=state.users.find(z=>z.id===uid);return u?`<div class="arrival-row"><div class="avatar">${u.emoji}</div><b>${esc(u.name)}</b><span>${esc(x.arrival)} · ${Number(x.distance||0).toFixed(1)} km</span></div>`:''}).join('');openModal(a.title,`<div class="card pad"><div class="eyebrow">${a.priority==='urgent'?'Dringend':a.priority==='important'?'Wichtig':'Ankündigung'}</div><p style="line-height:1.6">${esc(a.body)}</p><div class="facts">${a.date?fact('calendar',formatDate(a.date)):''}${a.time?fact('clock',a.time+' Uhr'):''}${a.place?fact('pin',a.place):''}</div></div>${a.lat?`<div class="actions"><button class="btn outline" id="navAnn">${I('route')} Navigation</button><button class="btn primary" id="arrivalAnn">${I('car')} Ankunft teilen</button></div>`:''}${(a.responseOptions||[]).length?`<div class="section"><div class="sectionhead"><h2>Deine Antwort</h2></div><div class="reactionbar">${a.responseOptions.map(o=>`<button class="react ${current===o?'active':''}" data-answer="${esc(o)}">${esc(o)} · ${(a.responses?.[o]||[]).length}</button>`).join('')}</div></div>`:''}${arrivals?`<div class="section"><div class="sectionhead"><h2>Wer kommt wann?</h2></div>${arrivals}</div>`:''}${isAdmin()?`<div class="section"><button class="btn outline wide" id="annStats">${I('eye')} Lesestatus & Antworten</button></div>`:''}<div class="section"><button class="btn bad wide" id="hideAnn">Aus meiner Liste entfernen</button></div>`,()=>{if(a.lat){$('#navAnn').onclick=()=>openMapsChoice(a.lat,a.lng,a.place);$('#arrivalAnn').onclick=()=>shareArrival('announcement',a.id)}$$('[data-answer]').forEach(b=>b.onclick=()=>{responseTo(a.id,b.dataset.answer);closeModal();openAnnouncementDetail(a.id)});$('#annStats')?.addEventListener('click',()=>openAnnouncementStats(a.id));$('#hideAnn').onclick=()=>{a.hiddenBy??=[];if(!a.hiddenBy.includes(me().id))a.hiddenBy.push(me().id);save();closeModal();page='announcements';render()}})}
function openAnnouncementStats(id){const a=state.announcements.find(x=>x.id===id);const read=new Set(a.readBy||[]);openModal('Lesestatus',`<div class="read-grid">${state.users.map(u=>`<div class="read-person ${read.has(u.id)?'yes':''}">${read.has(u.id)?'✓':'○'} ${esc(u.name)}<br><span class="muted tiny">${read.has(u.id)?'gesehen':'noch ungelesen'}</span></div>`).join('')}</div><div class="section"><div class="sectionhead"><h2>Antworten</h2></div>${(a.responseOptions||[]).map(o=>`<div class="card pad"><b>${esc(o)}</b><div class="muted small">${(a.responses?.[o]||[]).map(uid=>state.users.find(u=>u.id===uid)?.name).filter(Boolean).join(', ')||'Niemand'}</div></div>`).join('')}</div>`)}
function openAnnouncementEditor(){let opts=['Dabei','Vielleicht','Nein'],pin={lat:null,lng:null};openModal('Ankündigung erstellen',`<div class="field"><label>Titel</label><input id="annTitle" placeholder="z. B. Treffen heute"></div><div class="field"><label>Nachricht</label><textarea id="annBody"></textarea></div><div class="field2"><div class="field"><label>Datum</label><input id="annDate" type="date"></div><div class="field"><label>Uhrzeit</label><input id="annTime" type="time"></div></div><div class="field"><label>Ort</label><input id="annPlace" placeholder="Treffpunkt"></div><div id="annMap" class="map" style="height:220px"></div><div class="field"><label>Antwortmöglichkeiten</label><div class="chips" id="optList"></div><div class="field2"><input id="optInput" placeholder="Eigene Antwort"><button class="btn outline" id="addOpt">＋ Hinzufügen</button></div></div><div class="switchrow"><span>Bestätigung erforderlich</span><button class="switch" id="confirmSwitch"></button></div><div class="switchrow"><span>Push senden</span><button class="switch on" id="pushSwitch"></button></div><button class="btn primary wide" id="saveAnn">Veröffentlichen</button>`,()=>{let confirm=false,push=true;modalMap=L.map('annMap').setView([49.48,8.53],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(modalMap);let marker=null;const setPin=(lat,lng)=>{pin={lat,lng};if(marker)marker.setLatLng([lat,lng]);else marker=L.marker([lat,lng],{draggable:true}).addTo(modalMap)};modalMap.on('click',e=>setPin(e.latlng.lat,e.latlng.lng));const ro=()=>{$('#optList').innerHTML=opts.map((o,i)=>`<button class="chip active" data-delopt="${i}">${esc(o)} ×</button>`).join('');$$('[data-delopt]').forEach(b=>b.onclick=()=>{opts.splice(+b.dataset.delopt,1);ro()})};ro();$('#addOpt').onclick=()=>{const v=$('#optInput').value.trim();if(v&&!opts.includes(v))opts.push(v);$('#optInput').value='';ro()};$('#confirmSwitch').onclick=()=>{$('#confirmSwitch').classList.toggle('on');confirm=!confirm};$('#pushSwitch').onclick=()=>{$('#pushSwitch').classList.toggle('on');push=!push};$('#saveAnn').onclick=()=>{const title=$('#annTitle').value.trim(),body=$('#annBody').value.trim();if(!title||!body)return toast('Titel und Nachricht fehlen');const responses={};opts.forEach(o=>responses[o]=[]);state.announcements.unshift({id:crypto.randomUUID(),title,body,priority:'important',_startsAt:makeLocalIso($('#annDate').value,$('#annTime').value),_pushEnabled:push,_isNew:true,created:'Gerade eben',date:$('#annDate').value,time:$('#annTime').value,place:$('#annPlace').value.trim(),lat:pin.lat,lng:pin.lng,responseOptions:opts,responses,readBy:[me().id],confirmedBy:confirm?[me().id]:[],confirmRequired:confirm,hiddenBy:[],arrivals:{}});state.audit.unshift(`${me().name} veröffentlichte ${title}`);save();closeModal();toast(push?'Ankündigung veröffentlicht · Push wird versendet':'Ankündigung veröffentlicht')}})}

async function shareArrival(kind,id){const obj=kind==='event'?state.events.find(x=>x.id===id):state.announcements.find(x=>x.id===id);if(!obj?.lat)return toast('Kein Treffpunkt hinterlegt');if(!navigator.geolocation)return toast('Standort nicht verfügbar');toast('Standort & Fahrzeit werden berechnet…');navigator.geolocation.getCurrentPosition(async p=>{const eta=await routeEta(p.coords.latitude,p.coords.longitude,obj.lat,obj.lng);obj.arrivals??={};obj.arrivals[me().id]={arrival:eta.arrival,minutes:eta.minutes,distance:eta.distance,updatedAt:Date.now()};state.live={...state.live,share:true,status:`Auf dem Weg zu ${obj.name||obj.title}`,lat:p.coords.latitude,lng:p.coords.longitude,target:{name:obj.name||obj.title,lat:obj.lat,lng:obj.lng,kind,id},eta,_etaAt:new Date(Date.now()+eta.minutes*60000).toISOString(),expiresAt:Date.now()+Math.max(90,eta.minutes+45)*60000};save();toast(`Ankunft geteilt · ${eta.arrival}`);closeModal();render()},()=>toast('Standortfreigabe wurde nicht erlaubt'),{enableHighAccuracy:true,timeout:12000,maximumAge:15000})}
async function routeEta(lat1,lng1,lat2,lng2){let km=haversine(lat1,lng1,lat2,lng2),minutes=Math.max(2,Math.round(km/45*60));try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=false`,{cache:'no-store'});if(r.ok){const j=await r.json();if(j.routes?.[0]){km=j.routes[0].distance/1000;minutes=Math.max(1,Math.round(j.routes[0].duration/60))}}}catch{}const arrival=new Date(Date.now()+minutes*60000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});return{distance:+km.toFixed(1),minutes,arrival}}
function haversine(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function openMapsChoice(lat,lng,label='Ziel'){openModal('Navigation',`<div class="card pad"><b>${esc(label)}</b><div class="muted small">${lat.toFixed(5)}, ${lng.toFixed(5)}</div></div><div class="actions"><button class="btn outline" id="appleMap">Apple Karten</button><button class="btn outline" id="googleMap">Google Maps</button></div>`,()=>{$('#appleMap').onclick=()=>window.open(`https://maps.apple.com/?q=${encodeURIComponent(label)}&ll=${lat},${lng}`,'_blank');$('#googleMap').onclick=()=>window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,'_blank')})}

function renderLive(){const eta=state.live.eta;$('#view').innerHTML=`${pageTitle('Crew','Live','Spontan draußen · Treffen · Konvoi')}
<div class="card live-summary"><div style="font-size:22px">${state.live.share?'🟣':'⚫'}</div><div style="flex:1"><b>${state.live.share?esc(state.live.status):'Du bist unsichtbar'}</b><div class="muted tiny">${state.live.share?(state.live.lat?'Standortfreigabe aktiv':'Standort wird geholt …'):'Standort wird nicht geteilt'}</div></div><button class="btn ${state.live.share?'bad':'primary'} sm" id="toggleLive">${state.live.share?'Reset':'Live gehen'}</button></div>${eta?`<div class="card eta-card"><div class="eyebrow">Deine Ankunft</div><h3 style="margin:5px 0">${esc(eta.arrival)} Uhr · ${eta.minutes} Min.</h3><div class="muted small">${eta.distance} km bis ${esc(state.live.target?.name||'Treffpunkt')}</div></div>`:''}<div id="liveMap" class="map"></div><div class="live-actions"><button class="btn outline" data-live="Bin unterwegs">${I('car')} Bin unterwegs</button><button class="btn good" data-live="Bin da">${I('pin')} Bin da</button><button class="btn warn" data-live="Tankstopp">⛽ Tankstopp</button><button class="btn bad" data-live="Panne">⚠ Panne</button></div><div class="section"><button class="btn outline wide" id="refreshLive">${I('pin')} Standort aktualisieren</button></div><div class="section"><button class="btn outline wide" id="backHome">← Zurück zur Startseite</button></div>`;
const center=state.live.lat?[state.live.lat,state.live.lng]:[49.48,8.53];map=L.map('liveMap').setView(center,state.live.lat?13:11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);const bounds=[];state.live.markers.forEach(m=>{const u=state.users.find(x=>x.id===m.id);L.marker([m.lat,m.lng]).addTo(map).bindPopup(`${u?.name||m.id}: ${m.status}`);bounds.push([m.lat,m.lng])});if(state.live.share&&state.live.lat){const startIcon=L.divIcon({className:'live-user-marker',html:'<span class="live-pin user-pin"><i></i></span>',iconSize:[34,34],iconAnchor:[17,17]});L.marker([state.live.lat,state.live.lng],{icon:startIcon,zIndexOffset:900}).addTo(map).bindPopup(`<b>Dein Standort</b><br>${esc(state.live.status)}`).openPopup();bounds.push([state.live.lat,state.live.lng])}if(state.live.target?.lat){const targetIcon=L.divIcon({className:'live-target-marker',html:'<span class="live-pin target-pin">★</span>',iconSize:[34,34],iconAnchor:[17,17]});L.marker([state.live.target.lat,state.live.target.lng],{icon:targetIcon,zIndexOffset:800}).addTo(map).bindPopup(`<b>Treffpunkt</b><br>${esc(state.live.target.name||'Ziel')}`);bounds.push([state.live.target.lat,state.live.target.lng]);if(state.live.lat)L.polyline([[state.live.lat,state.live.lng],[state.live.target.lat,state.live.target.lng]],{color:'#a445ff',weight:3,opacity:.65,dashArray:'8 10'}).addTo(map)}if(bounds.length>1)map.fitBounds(bounds,{padding:[45,45],maxZoom:14});else if(bounds.length===1)map.setView(bounds[0],13);
const acquireLocation=(status,quiet=false)=>{if(!navigator.geolocation){if(!quiet)toast('Standort nicht verfügbar');return}if(!quiet)toast('Standort wird aktualisiert …');navigator.geolocation.getCurrentPosition(p=>{state.live.share=true;state.live.status=status||state.live.status||'Bin unterwegs';state.live.lat=p.coords.latitude;state.live.lng=p.coords.longitude;state.live.expiresAt=Date.now()+60*60000;save();renderLive()},()=>{if(!quiet)toast('Standort nicht erlaubt')},{enableHighAccuracy:true,timeout:12000,maximumAge:10000})};$('#toggleLive').onclick=()=>{if(state.live.share){state.live.share=false;state.live.status='Unsichtbar';state.live.lat=null;state.live.lng=null;state.live.eta=null;state.live.target=null;save();renderLive()}else acquireLocation('Bin unterwegs')};$$('[data-live]').forEach(b=>b.onclick=()=>{const status=b.dataset.live;if(state.live.lat){state.live.share=true;state.live.status=status;save();renderLive()}else acquireLocation(status)});$('#refreshLive').onclick=()=>acquireLocation(state.live.status||'Bin unterwegs');$('#backHome').onclick=()=>{page='home';render()};if(state.live.share&&!state.live.lat)setTimeout(()=>acquireLocation(state.live.status||'Bin unterwegs',true),250)}

<style>

*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 60% -10%,#2a1340 0,#0c0e13 35%,#07080b 72%);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent}button,input,textarea,select{font:inherit}.app{max-width:620px;margin:0 auto;min-height:100dvh;background:rgba(5,6,9,.94);border-left:1px solid #171923;border-right:1px solid #171923;position:relative;padding-bottom:92px}.top{position:sticky;top:0;z-index:50;padding:max(16px,env(safe-area-inset-top)) 18px 12px;background:linear-gradient(180deg,rgba(5,6,9,.97),rgba(5,6,9,.88),rgba(5,6,9,0));backdrop-filter:blur(18px)}.brandrow{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--purple2));display:grid;place-items:center;font-weight:900;box-shadow:0 0 30px rgba(139,92,246,.35)}.brand{flex:1}.brand b{font-size:20px;letter-spacing:-.4px}.brand span{display:block;font-size:10px;letter-spacing:2.4px;color:#bfc4cf;margin-top:2px}.iconbtn{border:1px solid var(--line);background:#12141b;color:white;border-radius:14px;width:42px;height:42px;display:grid;place-items:center;position:relative}.badge{position:absolute;right:-4px;top:-4px;background:var(--purple);font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center}.content{padding:8px 16px 32px}.hero{background:linear-gradient(145deg,#171923,#0e1015);border:1px solid #292c38;border-radius:24px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;right:-90px;top:-80px;background:radial-gradient(circle,#8b5cf675,transparent 65%)}.eyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:#c9b7ff;font-weight:800}.hero h1{font-size:32px;line-height:1.02;margin:8px 0 12px;letter-spacing:-1.2px}.hero p{margin:0;color:#c2c7d2;line-height:1.45}.row{display:flex;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:linear-gradient(180deg,#14171e,#101218);border:1px solid var(--line);border-radius:20px;padding:15px}.card h3,.card h2{margin:0}.section{margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.sectionhead h2{font-size:19px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.stat{padding:14px 10px;text-align:center}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}.btn{border:0;border-radius:14px;padding:12px 14px;background:#1c2029;color:#fff;font-weight:750}.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 8px 30px rgba(139,92,246,.25)}.btn.good{background:#11361f;border:1px solid #236a3a}.btn.bad{background:#3b1518;border:1px solid #6b242b}.btn.warn{background:#412f0d;border:1px solid #6b5118}.btn.outline{background:transparent;border:1px solid #343a47}.btn.wide{width:100%}.btn:active{transform:scale(.98)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid #353a46;color:#d5d9e1;padding:7px 10px;border-radius:999px;background:#171a22}.chip.active{border-color:#9b70ff;background:#2a1d49}.list{display:flex;flex-direction:column;gap:10px}.member{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#282d38,#161922);display:grid;place-items:center;font-weight:850;border:1px solid #323746;flex:0 0 auto}.member .info{min-width:0;flex:1}.member .info b{display:block}.member .info span{font-size:12px;color:var(--muted)}.role{font-size:10px;letter-spacing:1.2px;font-weight:900;border-radius:999px;padding:6px 9px;border:1px solid #555}.role.owner{color:#d8c9ff;border-color:#8b5cf6}.role.admin{color:#f0c6ff;border-color:#c026d3}.role.mod{color:#b9d4ff;border-color:#3b82f6}.role.memberr{color:#ccd1dc}.event{display:flex;gap:13px}.eventicon{width:56px;height:56px;border-radius:17px;background:linear-gradient(135deg,#4c1d95,#db2777);display:grid;place-items:center;font-size:25px;flex:0 0 auto}.eventmain{flex:1}.eventmain h3{font-size:16px}.eventmain p{margin:4px 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions .btn{padding:9px 11px;font-size:12px}.announcement{border-left:3px solid var(--purple)}.announcement.urgent{border-left-color:var(--red)}.announcement .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.announcement h3{font-size:17px;margin:8px 0 6px}.announcement p{margin:0;color:#d2d6df;line-height:1.45}.reactionbar{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.react{border:1px solid #303542;background:#171a22;color:#e7e9ef;border-radius:999px;padding:7px 10px;font-size:12px}.react.active{background:#312151;border-color:#8b5cf6}.bottom{position:fixed;z-index:80;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,9,12,.92);backdrop-filter:blur(22px);border-top:1px solid #20232c;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{border:0;background:transparent;color:#858c9b;border-radius:14px;padding:7px 2px;font-size:10px}.navbtn i{font-style:normal;font-size:21px;display:block;margin-bottom:2px}.navbtn.active{color:#b38cff;background:#191326}.fab{position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:100px;z-index:70;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-size:27px;box-shadow:0 16px 40px rgba(139,92,246,.38)}.modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;display:none;align-items:flex-end;justify-content:center}.modalwrap.show{display:flex}.sheet{width:min(620px,100%);max-height:88dvh;overflow:auto;border-radius:28px 28px 0 0;background:#101219;border:1px solid #2a2e39;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -30px 80px rgba(0,0,0,.5)}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheethead h2{margin:0}.close{border:1px solid #333844;background:#191c24;color:#fff;border-radius:50%;width:36px;height:36px}.field{margin:10px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #303542;background:#0b0d12;color:#fff;border-radius:14px;padding:12px;outline:none}.field textarea{min-height:100px;resize:vertical}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#171a22;border:1px solid #363b47;padding:11px 14px;border-radius:14px;z-index:300;display:none;box-shadow:var(--shadow);max-width:calc(100vw - 30px)}.toast.show{display:block}.map{height:390px;border-radius:22px;overflow:hidden;border:1px solid #2b2f3a}.leaflet-container{background:#0b0d12}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.quick .btn{font-size:10px;padding:10px 5px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo{aspect-ratio:1.2/1;border-radius:17px;overflow:hidden;background:#181b22;border:1px solid #303541;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photolabel{position:absolute;left:8px;bottom:8px;background:rgba(8,9,12,.8);backdrop-filter:blur(8px);font-size:10px;padding:5px 7px;border-radius:999px}.notice{padding:12px;border:1px solid #493c1c;background:#2c230d;color:#f4d36f;border-radius:15px;font-size:12px;line-height:1.45}.install{margin-top:12px}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #232731}.switch{width:48px;height:28px;border-radius:999px;background:#242934;position:relative;border:0}.switch:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:white;top:2px;left:3px;transition:.2s}.switch.on{background:#6d45d8}.switch.on:after{left:22px}.seg{display:flex;border:1px solid #303541;border-radius:15px;padding:4px;background:#101219}.seg button{flex:1;border:0;border-radius:11px;padding:9px;background:transparent;color:var(--muted)}.seg button.active{background:#2a1d49;color:white}.adminOnly{display:none}.isAdmin .adminOnly{display:block}.ownerOnly{display:none}.isOwner .ownerOnly{display:block}.desktopHint{display:none}@media(min-width:800px){.desktopHint{display:block}.app{box-shadow:0 0 70px #000}.fab{right:calc((100vw - 620px)/2 + 18px)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brandrow">
      <div class="mark">4W</div>
      <div class="brand"><b>4 Wheels 1 Family</b><span>MORE THAN A CREW</span></div>
      <button class="iconbtn" id="notifBtn">🔔<span class="badge" id="notifBadge">2</span></button>
      <button class="iconbtn" id="profileBtn">👤</button>
    </div>
  </header>
  <main class="content" id="view"></main>
  <button class="fab adminOnly" id="fab">＋</button>
  <nav class="bottom" id="bottom"></nav>
</div>
<div class="modalwrap" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const seed={
 currentUser:'steve',
 users:[
  {id:'steve',name:'Steve',role:'owner',car:'Saab 9-3 Turbo SE Cabrio',ig:'@steve',status:'Unterwegs',emoji:'👑'},
  {id:'leni',name:'Leni',role:'admin',car:'Audi RS3',ig:'@leni',status:'Online',emoji:'💜'},
  {id:'max',name:'Max',role:'admin',car:'BMW M4',ig:'@max',status:'Am Waschpark',emoji:'🔥'},
  {id:'emma',name:'Emma',role:'admin',car:'VW Golf',ig:'@emma',status:'Offline',emoji:'✨'},
  {id:'leon',name:'Leon',role:'member',car:'BMW 3er',ig:'@leon',status:'Unterwegs',emoji:'🚗'}
 ],
 applications:[{id:'app1',name:'Tobias',car:'BMW M3',text:'Möchte der Crew beitreten.'},{id:'app2',name:'Jasmin',car:'Seat Leon Cupra',text:'Möchte der Crew beitreten.'}],
 announcements:[
  {id:'a1',title:'Spontanes Treffen heute',body:'Wer Lust hat: ab 19:30 Uhr am Waschpark. Kurz reagieren, damit wir wissen wer kommt.',priority:'important',created:'Heute · 08:12',confirm:true,reactions:{'👍 Dabei':['steve','max'],'👀 Gelesen':['leni'],'❌ Nein':[]}},
  {id:'a2',title:'Sticker-Bestellung',body:'Die neuen Heckscheiben-Sticker sind in Planung. Designs kommen später zur Abstimmung.',priority:'normal',created:'Gestern · 20:41',confirm:false,reactions:{'🔥 Feier ich':['steve','leni','max'],'👍 Gelesen':['emma','leon']}}
 ],
 events:[
  {id:'e1',name:'Night Drive Mannheim',date:'Sa, 26.09 · 20:00',place:'Treffpunkt folgt',type:'Ausfahrt',rsvp:{steve:'yes',leni:'maybe',max:'yes'}},
  {id:'e2',name:'Spontanes Treffen Waschpark',date:'Heute · 19:30',place:'Waschpark',type:'Treffen',rsvp:{steve:'yes',max:'yes',leon:'yes'}}
 ],
 live:{share:false,until:'Aus',status:'Unsichtbar',markers:[
   {name:'Max',lat:49.4658,lng:8.5661,status:'Am Treffpunkt'},{name:'Leon',lat:49.4781,lng:8.5367,status:'Unterwegs'},{name:'Leni',lat:49.4934,lng:8.4662,status:'Online'}
 ]},
 whatsapp:'',
 photos:[],
 audit:['Demo gestartet','Steve ist Owner der Crew'],
 settings:{push:false,autoLocation:false}
};
let state=load();let page='home';let map=null;let userMarker=null;
const $=s=>document.querySelector(s);const app=$('#app');
function clone(v){return JSON.parse(JSON.stringify(v))}function load(){try{return JSON.parse(localStorage.getItem('4w1f-state'))||clone(seed)}catch{return clone(seed)}}function save(){localStorage.setItem('4w1f-state',JSON.stringify(state))}
function me(){return state.users.find(u=>u.id===state.currentUser)||state.users[0]}function isAdmin(){return ['owner','admin'].includes(me().role)}function isOwner(){return me().role==='owner'}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function roleLabel(r){return r==='owner'?'OWNER':r==='admin'?'ADMIN':r==='moderator'?'MODERATOR':'MITGLIED'}
function roleClass(r){return r==='moderator'?'mod':r==='member'?'memberr':r}
function setClasses(){app.classList.toggle('isAdmin',isAdmin());app.classList.toggle('isOwner',isOwner())}
const nav=[['home','🏠','Home'],['live','📍','Live'],['announce','📢','Ankündigungen'],['crew','👥','Crew'],['more','⚙️','Mehr']];
function renderNav(){bottom.innerHTML=nav.map(n=>`<button class="navbtn ${page===n[0]?'active':''}" data-page="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('');bottom.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function render(){setClasses();renderNav();fab.style.display=isAdmin()&&['announce','crew','home'].includes(page)?'block':'none';fab.onclick=()=>openQuickCreate();if(map){map.remove();map=null}({home:renderHome,live:renderLive,announce:renderAnnouncements,crew:renderCrew,more:renderMore}[page]||renderHome)();}
function section(title,body,extra=''){return `<section class="section"><div class="sectionhead"><h2>${title}</h2>${extra}</div>${body}</section>`}
function renderHome(){const total=state.users.length;const live=state.live.markers.length+(state.live.share?1:0);view.innerHTML=`
<div class="hero"><div class="eyebrow">CARS · PEOPLE · PASSION · FAMILY</div><h1>Willkommen, ${esc(me().name)}.</h1><p>Alles für eure Crew an einem Ort – Live, Treffen, Ankündigungen, Fahrzeuge, Bilder und Admin.</p><div class="actions"><button class="btn primary" id="goLive">📍 Crew Live öffnen</button><button class="btn outline" id="quickMeet">⚡ Spontanes Treffen</button></div></div>
${section('Crew heute',`<div class="grid3"><div class="card stat"><b>${total}</b><span>Mitglieder</span></div><div class="card stat"><b>${live}</b><span>Live sichtbar</span></div><div class="card stat"><b>${state.announcements.length}</b><span>Ankündigungen</span></div></div>`)}
${section('Nächstes Treffen',eventCard(state.events[1]||state.events[0]))}
${section('Aktuelle Ankündigung',announcementCard(state.announcements[0]))}
${section('Schnellzugriff',`<div class="grid2"><button class="btn outline" id="wa">💬 WhatsApp-Gruppe</button><button class="btn outline" id="galleryBtn">📸 Galerie</button><button class="btn outline" id="socialBtn">📱 Social Studio</button><button class="btn outline" id="installBtn">⬇️ App installieren</button></div>`)}
`;
$('#goLive').onclick=()=>{page='live';render()};$('#quickMeet').onclick=()=>openMeet();$('#wa').onclick=openWhatsApp;$('#galleryBtn').onclick=openGallery;$('#socialBtn').onclick=openSocial;$('#installBtn').onclick=openInstall;
}
function eventCard(e){if(!e)return '<div class="card muted">Noch kein Treffen geplant.</div>';const mine=e.rsvp?.[me().id]||'none';return `<div class="card event"><div class="eventicon">${e.type==='Ausfahrt'?'🏁':'☕'}</div><div class="eventmain"><h3>${esc(e.name)}</h3><p>${esc(e.date)} · ${esc(e.place)}</p><div class="actions"><button class="btn ${mine==='yes'?'primary':'outline'}" data-rsvp="yes" data-id="${e.id}">Dabei</button><button class="btn ${mine==='maybe'?'warn':'outline'}" data-rsvp="maybe" data-id="${e.id}">Vielleicht</button><button class="btn ${mine==='no'?'bad':'outline'}" data-rsvp="no" data-id="${e.id}">Nein</button></div></div></div>`}
function announcementCard(a){if(!a)return '';const seen=Object.values(a.reactions||{}).some(arr=>arr.includes(me().id));return `<div class="card announcement ${a.priority==='urgent'?'urgent':''}"><div class="meta"><span>${a.priority==='urgent'?'🔴 Dringend':a.priority==='important'?'🟣 Wichtig':'Info'}</span><span>${esc(a.created)}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p><div class="reactionbar">${Object.entries(a.reactions||{}).map(([k,v])=>`<button class="react ${v.includes(me().id)?'active':''}" data-react="${esc(k)}" data-aid="${a.id}">${esc(k)} · ${v.length}</button>`).join('')}</div>${a.confirm&&!seen?`<button class="btn primary wide" style="margin-top:10px" data-confirm="${a.id}">Gelesen & verstanden</button>`:''}</div>`}
function renderAnnouncements(){view.innerHTML=`<div class="hero"><div class="eyebrow">ANKÜNDIGUNGEN</div><h1>Nichts Wichtiges mehr übersehen.</h1><p>Push, Lesestatus und Reaktionen statt Ankündigungen, die irgendwo in WhatsApp versanden.</p></div>${section('Alle',`<div class="list">${state.announcements.map(announcementCard).join('')}</div>`,`<button class="btn primary adminOnly" id="newAnn">＋ Neu</button>`)}`;$('#newAnn')?.addEventListener('click',openAnnouncement);bindReactions()}
function bindReactions(){view.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>{const a=state.announcements.find(x=>x.id===b.dataset.aid);const key=b.dataset.react;Object.values(a.reactions).forEach(arr=>{const i=arr.indexOf(me().id);if(i>=0)arr.splice(i,1)});a.reactions[key].push(me().id);save();render()});view.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{const a=state.announcements.find(x=>x.id===b.dataset.confirm);a.reactions['👀 Gelesen']??=[];if(!a.reactions['👀 Gelesen'].includes(me().id))a.reactions['👀 Gelesen'].push(me().id);save();render();toast('Bestätigung gespeichert')})}
function renderLive(){view.innerHTML=`<div class="hero"><div class="eyebrow">CREW LIVE</div><h1>Wer ist gerade draußen?</h1><p>Standort wird nur geteilt, wenn das Mitglied es selbst aktiviert.</p><div class="actions"><button class="btn ${state.live.share?'good':'primary'}" id="shareLocation">${state.live.share?'✅ Standort wird geteilt':'📍 Standort teilen'}</button><button class="btn outline" id="statusBtn">Status: ${esc(state.live.status)}</button></div></div>
${section('Live-Karte',`<div id="map" class="map"></div><div class="quick"><button class="btn bad" data-live-status="🆘 Panne">🆘<br>Panne</button><button class="btn warn" data-live-status="⛽ Tankstopp">⛽<br>Tankstopp</button><button class="btn outline" data-live-status="👋 Crew verloren">👋<br>Crew verloren</button><button class="btn outline" id="liveWa">💬<br>WhatsApp</button></div>`)}
${section('Gerade aktiv',`<div class="list">${[...(state.live.share?[{name:me().name,status:state.live.status||'Unterwegs'}]:[]),...state.live.markers].map(m=>`<div class="card member"><div class="avatar">📍</div><div class="info"><b>${esc(m.name)}</b><span>${esc(m.status)}</span></div><span class="chip active">LIVE</span></div>`).join('')}</div>`)}
`;setTimeout(initMap,20);$('#shareLocation').onclick=toggleLocation;$('#statusBtn').onclick=openStatus;$('#liveWa').onclick=openWhatsApp;view.querySelectorAll('[data-live-status]').forEach(b=>b.onclick=()=>{state.live.status=b.dataset.liveStatus;state.live.share=true;save();render();toast('Status aktualisiert')})}
function initMap(){if(!window.L||!$('#map'))return;map=L.map('map',{zoomControl:false}).setView([49.48,8.53],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);state.live.markers.forEach(m=>L.marker([m.lat,m.lng]).addTo(map).bindPopup(`<b>${esc(m.name)}</b><br>${esc(m.status)}`));if(state.live.share&&navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{userMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup(`<b>${esc(me().name)}</b><br>${esc(state.live.status)}`);map.setView([p.coords.latitude,p.coords.longitude],13)},()=>{}, {enableHighAccuracy:true,timeout:5000})}}
function toggleLocation(){if(state.live.share){state.live.share=false;state.live.status='Unsichtbar';save();render();return}if(!navigator.geolocation){toast('Standort wird von diesem Browser nicht unterstützt');return}navigator.geolocation.getCurrentPosition(p=>{state.live.share=true;state.live.status='Unterwegs';save();render();toast('Standortfreigabe aktiv')},e=>toast('Standortfreigabe wurde nicht erlaubt'),{enableHighAccuracy:true,timeout:8000})}
function renderCrew(){const memberHtml=state.users.map(u=>`<div class="card member"><div class="avatar">${u.emoji||'🚗'}</div><div class="info"><b>${esc(u.name)}</b><span>${esc(u.car)} · ${esc(u.status)}</span></div><span class="role ${roleClass(u.role)}">${roleLabel(u.role)}</span>${isAdmin()?`<button class="iconbtn" data-member="${u.id}">•••</button>`:''}</div>`).join('');view.innerHTML=`<div class="hero"><div class="eyebrow">CREW</div><h1>${state.users.length} Menschen. Eine Familie.</h1><p>Mitglieder, Rollen, Fahrzeuge und Bewerbungen zentral verwalten.</p></div>${section('Mitglieder',`<div class="list">${memberHtml}</div>`,`<button class="btn primary adminOnly" id="inviteBtn">＋ Einladen</button>`)}${isAdmin()?section(`Offene Anfragen (${state.applications.length})`,`<div class="list">${state.applications.map(a=>`<div class="card"><b>${esc(a.name)}</b><div class="muted small">${esc(a.car)} · ${esc(a.text)}</div><div class="actions"><button class="btn primary" data-accept="${a.id}">Annehmen</button><button class="btn bad" data-reject="${a.id}">Ablehnen</button></div></div>`).join('')||'<div class="muted">Keine offenen Anfragen.</div>'}</div>`):''}`;$('#inviteBtn')?.addEventListener('click',openInvite);view.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>openMember(b.dataset.member));view.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptApp(b.dataset.accept));view.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{state.applications=state.applications.filter(x=>x.id!==b.dataset.reject);save();render()})}
function acceptApp(id){const a=state.applications.find(x=>x.id===id);if(!a)return;state.users.push({id:'u'+Date.now(),name:a.name,role:'member',car:a.car,ig:'',status:'Offline',emoji:'🚗'});state.applications=state.applications.filter(x=>x.id!==id);state.audit.unshift(`${me().name} hat ${a.name} aufgenommen`);save();render();toast('Mitglied aufgenommen')}
function renderMore(){view.innerHTML=`<div class="hero"><div class="eyebrow">MEHR</div><h1>Alles andere.</h1><p>Galerie, Social Media, Events, WhatsApp, Installation, Einstellungen und Admin.</p></div>
${section('Bereiche',`<div class="grid2"><button class="btn outline" id="events">📅 Events & Ausfahrten</button><button class="btn outline" id="gallery">📸 Galerie</button><button class="btn outline" id="social">📱 Social Studio</button><button class="btn outline" id="whatsapp">💬 WhatsApp</button><button class="btn outline" id="install">⬇️ Installation</button><button class="btn outline" id="profile">🚗 Mein Profil</button></div>`)}
${isAdmin()?section('Admin',`<div class="grid2"><button class="btn outline" id="audit">🧾 Audit-Log</button><button class="btn outline" id="backup">💾 Backup</button><button class="btn outline" id="branding">🎨 Crew Branding</button><button class="btn outline" id="pushTest">🔔 Push-Test</button></div>`):''}
${section('Testkonto',`<div class="card"><div class="member"><div class="avatar">${me().emoji}</div><div class="info"><b>${esc(me().name)}</b><span>${roleLabel(me().role)} · ${esc(me().car)}</span></div><button class="btn outline" id="switchUser">Wechseln</button></div></div>`)}
`;$('#events').onclick=openEvents;$('#gallery').onclick=openGallery;$('#social').onclick=openSocial;$('#whatsapp').onclick=openWhatsApp;$('#install').onclick=openInstall;$('#profile').onclick=openMyProfile;$('#switchUser').onclick=openProfileSwitch;$('#audit')?.addEventListener('click',openAudit);$('#backup')?.addEventListener('click',openBackup);$('#branding')?.addEventListener('click',()=>toast('Branding-Editor ist für Cloud-V1 vorbereitet'));$('#pushTest')?.addEventListener('click',pushTest)}
function openModal(title,html,onReady){modal.classList.add('show');sheet.innerHTML=`<div class="sheethead"><h2>${title}</h2><button class="close" id="closeModal">✕</button></div>${html}`;$('#closeModal').onclick=closeModal;onReady?.()}
function closeModal(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)closeModal()}
function openQuickCreate(){openModal('Neu erstellen',`<div class="grid2"><button class="btn primary" id="qa">📢 Ankündigung</button><button class="btn outline" id="qe">📅 Event</button><button class="btn outline" id="qm">⚡ Spontanes Treffen</button><button class="btn outline" id="qi">👤 Einladung</button></div>`,()=>{$('#qa').onclick=()=>{closeModal();openAnnouncement()};$('#qe').onclick=()=>{closeModal();openEventForm()};$('#qm').onclick=()=>{closeModal();openMeet()};$('#qi').onclick=()=>{closeModal();openInvite()}})}
function openAnnouncement(){openModal('Ankündigung erstellen',`<div class="field"><label>Titel</label><input id="annTitle" placeholder="z. B. Treffen heute" /></div><div class="field"><label>Nachricht</label><textarea id="annBody"></textarea></div><div class="field"><label>Priorität</label><select id="annPriority"><option value="normal">Normal</option><option value="important">Wichtig</option><option value="urgent">Dringend</option></select></div><div class="switchrow"><span>Bestätigung erforderlich</span><button class="switch" id="confirmSwitch"></button></div><div class="switchrow"><span>Push senden</span><button class="switch on" id="pushSwitch"></button></div><button class="btn primary wide" id="saveAnn">Veröffentlichen</button>`,()=>{let conf=false,push=true;$('#confirmSwitch').onclick=()=>{conf=!conf;$('#confirmSwitch').classList.toggle('on',conf)};$('#pushSwitch').onclick=()=>{push=!push;$('#pushSwitch').classList.toggle('on',push)};$('#saveAnn').onclick=()=>{const title=$('#annTitle').value.trim(),body=$('#annBody').value.trim();if(!title||!body)return toast('Titel und Nachricht fehlen');state.announcements.unshift({id:'a'+Date.now(),title,body,priority:$('#annPriority').value,created:'Gerade eben',confirm:conf,reactions:{'👍 Dabei':[],'👀 Gelesen':[],'❌ Nein':[]}});state.audit.unshift(`${me().name} hat Ankündigung „${title}“ veröffentlicht`);save();closeModal();page='announce';render();if(push)pushTest(title,body)}})}
function openStatus(){openModal('Live-Status',`<div class="list">${['Unterwegs','Am Treffpunkt','Spontanes Treffen?','Fotos machen','⛽ Tankstopp','🆘 Panne','Unsichtbar'].map(s=>`<button class="btn outline" data-status="${s}">${s}</button>`).join('')}</div>`,()=>sheet.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{state.live.status=b.dataset.status;state.live.share=b.dataset.status!=='Unsichtbar';save();closeModal();render()}))}
function openMeet(){if(!isAdmin())return toast('Nur Admins können Treffen erstellen');openModal('Spontanes Treffen',`<div class="field"><label>Name</label><input id="meetName" value="Spontanes Treffen" /></div><div class="field"><label>Ort</label><input id="meetPlace" placeholder="z. B. Waschpark" /></div><div class="field"><label>Wann?</label><input id="meetDate" value="Heute · 19:30" /></div><button class="btn primary wide" id="saveMeet">Treffen erstellen</button>`,()=>$('#saveMeet').onclick=()=>{state.events.unshift({id:'e'+Date.now(),name:$('#meetName').value||'Spontanes Treffen',date:$('#meetDate').value||'Heute',place:$('#meetPlace').value||'Treffpunkt folgt',type:'Treffen',rsvp:{[me().id]:'yes'}});save();closeModal();render();toast('Treffen erstellt')})}
function openEvents(){openModal('Events & Ausfahrten',`<div class="list">${state.events.map(eventCard).join('')}</div>${isAdmin()?'<button class="btn primary wide" id="newEvent" style="margin-top:12px">＋ Event erstellen</button>':''}`,()=>{bindRsvp(sheet);$('#newEvent')?.addEventListener('click',()=>{closeModal();openEventForm()})})}
function bindRsvp(root=document){root.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=()=>{const e=state.events.find(x=>x.id===b.dataset.id);e.rsvp??={};e.rsvp[me().id]=b.dataset.rsvp;save();if(root===document)render();else{closeModal();openEvents()}})}
function openEventForm(){openModal('Event erstellen',`<div class="field"><label>Name</label><input id="evName" /></div><div class="field"><label>Datum / Zeit</label><input id="evDate" placeholder="Sa, 03.10 · 20:00" /></div><div class="field"><label>Treffpunkt</label><input id="evPlace" /></div><div class="field"><label>Typ</label><select id="evType"><option>Treffen</option><option>Ausfahrt</option><option>Car Meet</option></select></div><button class="btn primary wide" id="saveEvent">Speichern</button>`,()=>$('#saveEvent').onclick=()=>{state.events.unshift({id:'e'+Date.now(),name:$('#evName').value||'Neues Event',date:$('#evDate').value||'Termin offen',place:$('#evPlace').value||'Treffpunkt folgt',type:$('#evType').value,rsvp:{[me().id]:'yes'}});save();closeModal();render();toast('Event erstellt')})}
function openInvite(){openModal('Mitglied einladen',`<div class="notice">In der Produktionsversion erzeugt die App hier einen sicheren Einladungslink + QR-Code. Für die Demo kannst du eine Bewerbung simulieren.</div><div class="field"><label>Name</label><input id="invName" /></div><div class="field"><label>Fahrzeug</label><input id="invCar" /></div><button class="btn primary wide" id="simInvite">Bewerbung simulieren</button>`,()=>$('#simInvite').onclick=()=>{state.applications.unshift({id:'app'+Date.now(),name:$('#invName').value||'Neues Mitglied',car:$('#invCar').value||'Fahrzeug offen',text:'Möchte der Crew beitreten.'});save();closeModal();page='crew';render()})}
function openMember(id){const u=state.users.find(x=>x.id===id);if(!u)return;const protectedOwner=u.role==='owner';openModal(u.name,`<div class="card"><div class="member"><div class="avatar">${u.emoji}</div><div class="info"><b>${esc(u.name)}</b><span>${esc(u.car)} · ${esc(u.ig)}</span></div><span class="role ${roleClass(u.role)}">${roleLabel(u.role)}</span></div></div>${protectedOwner?'<div class="notice" style="margin-top:12px">🔒 Der Owner kann nicht herabgestuft oder entfernt werden.</div>':`<div class="field"><label>Rolle</label><select id="roleSel"><option value="member" ${u.role==='member'?'selected':''}>Mitglied</option><option value="moderator" ${u.role==='moderator'?'selected':''}>Moderator</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div><button class="btn primary wide" id="saveRole">Rolle speichern</button><button class="btn bad wide" id="removeMember" style="margin-top:8px">Mitglied entfernen</button>`}`,()=>{if(!protectedOwner){$('#saveRole').onclick=()=>{if(!isOwner()&&$('#roleSel').value==='admin')return toast('Nur der Owner darf Admin-Rechte vergeben');u.role=$('#roleSel').value;state.audit.unshift(`${me().name} änderte ${u.name} auf ${roleLabel(u.role)}`);save();closeModal();render()};$('#removeMember').onclick=()=>{state.users=state.users.filter(x=>x.id!==u.id);state.audit.unshift(`${me().name} hat ${u.name} entfernt`);save();closeModal();render()}}})}
function openProfileSwitch(){openModal('Testprofil wechseln',`<div class="list">${state.users.map(u=>`<button class="btn outline member" data-switch="${u.id}"><span class="avatar">${u.emoji}</span><span class="info" style="text-align:left"><b>${u.name}</b><span>${roleLabel(u.role)}</span></span></button>`).join('')}</div>`,()=>sheet.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{state.currentUser=b.dataset.switch;save();closeModal();render();toast(`Jetzt als ${me().name}`)}))}
function openMyProfile(){openModal('Mein Profil',`<div class="card"><div class="member"><div class="avatar">${me().emoji}</div><div class="info"><b>${esc(me().name)}</b><span>${roleLabel(me().role)}</span></div></div></div><div class="field"><label>Fahrzeug</label><input id="myCar" value="${esc(me().car)}" /></div><div class="field"><label>Instagram</label><input id="myIg" value="${esc(me().ig)}" /></div><button class="btn primary wide" id="saveProfile">Speichern</button>`,()=>$('#saveProfile').onclick=()=>{me().car=$('#myCar').value;me().ig=$('#myIg').value;save();closeModal();render()})}
function openGallery(){openModal('Crew Galerie',`<div class="notice">Fotos bleiben in dieser Demo nur auf diesem Gerät. In Produktion kommen sie in den Crew-Cloudspeicher.</div><div class="gallery" id="galleryGrid" style="margin-top:12px">${state.photos.length?state.photos.map((p,i)=>`<div class="photo"><img src="${p.data}" alt="Crew Foto"/><span class="photolabel">${esc(p.label||'Crew Foto')}</span></div>`).join(''):`<div class="card muted" style="grid-column:1/-1">Noch keine eigenen Fotos hochgeladen.</div>`}</div><label class="btn primary wide" style="display:block;text-align:center;margin-top:12px">＋ Fotos hochladen<input id="photoInput" type="file" accept="image/*" multiple hidden></label><button class="btn outline wide" id="scanPhotos" style="margin-top:8px">✨ Fahrzeuge erkennen (Demo)</button>`,()=>{$('#photoInput').onchange=e=>handlePhotos(e.target.files);$('#scanPhotos').onclick=()=>{if(!state.photos.length)return toast('Erst mindestens ein Foto hochladen');state.photos.forEach((p,i)=>p.label=['Steve erkannt','Max erkannt','Leni erkannt','Crew-Fahrzeug'][i%4]);save();closeModal();openGallery();toast('Demo-Erkennung abgeschlossen')}})}
function handlePhotos(files){[...files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=()=>{state.photos.unshift({data:r.result,label:'Neu'});state.photos=state.photos.slice(0,10);save();closeModal();openGallery()};r.readAsDataURL(f)})}
function openSocial(){const recognized=state.photos.filter(p=>p.label&&p.label.includes('erkannt')).map(p=>p.label.replace(' erkannt',''));openModal('Social Media Studio',`<div class="eyebrow">INSTAGRAM POST</div><div class="field"><label>Caption</label><textarea id="caption">Night Drive mit 4 Wheels 1 Family 🌙\nGute Autos. Bessere Menschen. Immer gemeinsam unterwegs. #4Wheels1Family #CarCrew</textarea></div><div class="card"><b>Erkannte Mitglieder</b><div class="chips" style="margin-top:10px">${recognized.length?recognized.map(n=>`<span class="chip active">${esc(n)}</span>`).join(''):'<span class="muted small">Noch keine Fahrzeugerkennung durchgeführt.</span>'}</div></div><div class="actions"><button class="btn outline" id="regenCap">✨ Caption neu</button><button class="btn primary" id="saveDraft">Entwurf speichern</button></div><div class="notice" style="margin-top:12px">Echtes automatisches Instagram-Publishing wird erst mit der Meta-API verbunden. Hier testen wir schon den kompletten Workflow.</div>`,()=>{$('#regenCap').onclick=()=>{$('#caption').value='Same roads. Same family. 💜\n4 Wheels 1 Family unterwegs – mehr als nur eine Crew.\n#4Wheels1Family #NightDrive #CarCommunity'};$('#saveDraft').onclick=()=>toast('Social-Entwurf gespeichert')})}
function openWhatsApp(){if(state.whatsapp){location.href=state.whatsapp;return}openModal('WhatsApp',`<div class="notice">Hinterlege einmal den Einladungslink eurer WhatsApp-Gruppe. Danach öffnet der Button direkt eure Gruppe.</div><div class="field"><label>WhatsApp-Gruppenlink</label><input id="waLink" placeholder="https://chat.whatsapp.com/..." /></div><button class="btn primary wide" id="saveWa">Speichern</button>`,()=>$('#saveWa').onclick=()=>{state.whatsapp=$('#waLink').value.trim();save();closeModal();toast('WhatsApp-Link gespeichert')})}
function openInstall(){const ua=navigator.userAgent;const ios=/iPhone|iPad|iPod/.test(ua);const android=/Android/.test(ua);openModal('App installieren',`<div class="card"><b>${ios?'🍎 iPhone erkannt':android?'🤖 Android erkannt':'💻 Gerät erkannt'}</b><p class="muted small">${ios?'In Safari: Teilen → Zum Home-Bildschirm → Hinzufügen. Danach startet die Crew-App wie eine normale App.':android?'In Chrome: Browser-Menü → App installieren / Zum Startbildschirm hinzufügen.':'Im Browser kann die App je nach System über „Installieren“ als App hinzugefügt werden.'}</p></div><div class="notice" style="margin-top:12px">Für Push auf iPhone muss die Web-App auf dem Home-Bildschirm installiert sein und Benachrichtigungen erlaubt bekommen.</div>`) }
async function pushTest(title='4 Wheels 1 Family',body='Test-Push: Die Crew-App kann Benachrichtigungen anzeigen.'){if(!('Notification'in window))return toast('Benachrichtigungen werden hier nicht unterstützt');const p=await Notification.requestPermission();if(p!=='granted')return toast('Benachrichtigungen nicht erlaubt');new Notification(title,{body,icon:''});state.settings.push=true;save();toast('Test-Benachrichtigung gesendet')}
function openAudit(){openModal('Admin Audit-Log',`<div class="list">${state.audit.map(x=>`<div class="card small">${esc(x)}</div>`).join('')}</div>`)}
function openBackup(){openModal('Backup & Restore',`<div class="notice">Damit kannst du den kompletten Demo-Zustand sichern, bevor wir beim Testen Chaos anrichten. 😂</div><div class="actions"><button class="btn primary" id="exportData">Backup kopieren</button><button class="btn outline" id="resetData">Demo zurücksetzen</button></div><div class="field"><label>Backup JSON importieren</label><textarea id="importJson"></textarea></div><button class="btn outline wide" id="importData">Importieren</button>`,()=>{$('#exportData').onclick=async()=>{await navigator.clipboard?.writeText(JSON.stringify(state));toast('Backup in Zwischenablage kopiert')};$('#resetData').onclick=()=>{state=clone(seed);save();closeModal();render();toast('Demo zurückgesetzt')};$('#importData').onclick=()=>{try{state=JSON.parse($('#importJson').value);save();closeModal();render();toast('Backup importiert')}catch{toast('Ungültiges Backup')}}})}
function showNotifications(){openModal('Benachrichtigungen',`<div class="list">${state.announcements.slice(0,5).map(a=>`<div class="card"><b>${esc(a.title)}</b><div class="muted small">${esc(a.created)}</div></div>`).join('')}</div><button class="btn primary wide" id="testNotif" style="margin-top:12px">🔔 Push-Test</button>`,()=>$('#testNotif').onclick=()=>pushTest())}
notifBtn.onclick=showNotifications;profileBtn.onclick=openProfileSwitch;fab.onclick=openQuickCreate;
document.addEventListener('click',e=>{const b=e.target.closest('[data-rsvp]');if(b&&document.body.contains(b)&&!sheet.contains(b)){const ev=state.events.find(x=>x.id===b.dataset.id);ev.rsvp??={};ev.rsvp[me().id]=b.dataset.rsvp;save();render()}const r=e.target.closest('[data-react]');if(r&&!sheet.contains(r)){const a=state.announcements.find(x=>x.id===r.dataset.aid);Object.values(a.reactions).forEach(arr=>{const i=arr.indexOf(me().id);if(i>=0)arr.splice(i,1)});a.reactions[r.dataset.react].push(me().id);save();render()}})
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>

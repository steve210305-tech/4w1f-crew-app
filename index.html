<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>4 Wheels 1 Family</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050507;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 50% 38%,rgba(134,46,255,.24),transparent 28%),radial-gradient(circle at 50% 70%,rgba(214,50,255,.10),transparent 24%);filter:blur(12px);pointer-events:none}
.card{position:relative;width:min(520px,100%);padding:54px 28px 46px;text-align:center;border:1px solid rgba(176,73,255,.22);border-radius:28px;background:linear-gradient(180deg,rgba(18,12,28,.84),rgba(6,5,10,.92));box-shadow:0 30px 90px rgba(0,0,0,.52),0 0 70px rgba(128,39,220,.10);backdrop-filter:blur(16px)}
.crown{font-size:34px;line-height:1;margin-bottom:18px;filter:drop-shadow(0 0 16px rgba(188,83,255,.55))}
.brand{font-weight:900;letter-spacing:-1.9px;text-transform:uppercase;font-size:clamp(30px,9vw,48px);line-height:.92}
.brand span{display:block;color:#fff}.brand b{display:block;color:#a94cff;font-weight:950}
.tag{margin-top:14px;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#b8afc8}
.line{width:64px;height:2px;margin:26px auto;background:linear-gradient(90deg,transparent,#ad4fff,transparent);box-shadow:0 0 14px #8b32e9}
h1{font-size:21px;margin:0 0 10px}
p{margin:0;color:#a9a2b5;font-size:14px;line-height:1.6}
.small{margin-top:26px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#6f687b}
</style>
</head>
<body>
<main class="card">
  <div class="crown">♛</div>
  <div class="brand"><span>4 Wheels</span><b>1 Family_</b></div>
  <div class="tag">More than a crew</div>
  <div class="line"></div>
  <h1>Die App ist derzeit offline.</h1>
  <p>4W1F ist momentan nicht öffentlich verfügbar.</p>
  <div class="small">4 Wheels · 1 Family</div>
</main>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
}
</script>
</body>
</html>

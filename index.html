button,input,textarea,select{font:inherit}.app{max-width:640px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:102px;background:linear-gradient(180deg,rgba(5,5,7,.78),rgba(5,5,7,.96) 55%);border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05);overflow:hidden}
.top{position:sticky;top:0;z-index:90;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:linear-gradient(180deg,rgba(5,5,7,.98),rgba(5,5,7,.88),rgba(5,5,7,.24));backdrop-filter:blur(22px)}
.brandrow{display:flex;align-items:center;gap:11px}.brandLogo{width:54px;height:54px;border-radius:18px;object-fit:cover;border:1px solid rgba(255,255,255,.15);box-shadow:var(--glow)}
.brand{min-width:0;flex:1}.brandName{font-family:"Barlow Condensed",sans-serif;font-size:25px;line-height:.95;font-weight:800;text-transform:uppercase;letter-spacing:.3px}.brandName em{font-family:"Permanent Marker",cursive;font-style:normal;color:#b65cff;text-transform:none;font-size:15px;margin-left:3px}.brandTag{display:block;margin-top:5px;font-size:9px;letter-spacing:3px;color:#a8a3af;text-transform:uppercase}
.iconbtn{border:1px solid var(--line);background:rgba(18,17,24,.76);color:#fff;border-radius:16px;width:45px;height:45px;display:grid;place-items:center;position:relative;backdrop-filter:blur(15px)}.iconbtn:active,.btn:active,.navbtn:active{transform:scale(.97)}
.badge{position:absolute;right:-5px;top:-5px;background:linear-gradient(135deg,var(--purple),var(--purple2));font-size:10px;font-weight:900;min-width:20px;height:20px;padding:0 5px;border-radius:12px;display:grid;place-items:center;border:2px solid #07070a}.badge.hidden{display:none}

.eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:3.4px;text-transform:uppercase;color:#c09cff;font-weight:800}.hero h1{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:38px;line-height:.96;margin:8px 0 10px;letter-spacing:-.7px}.hero h1 .script{font-family:"Permanent Marker",cursive;text-transform:none;color:#ae56ff;font-size:.72em}.hero p{margin:0;color:#c8c4cf;line-height:1.5;font-size:14px;max-width:92%}
.heroLogo{position:absolute;right:-8px;bottom:-18px;width:160px;opacity:.11;filter:saturate(1.5);z-index:0!important}
.section{margin-top:19px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 3px 10px}.sectionhead h2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.7px;font-size:23px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}
.card{background:linear-gradient(145deg,rgba(25,23,34,.83),rgba(11,11,16,.85));border:1px solid var(--line);border-radius:21px;padding:15px;backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(0,0,0,.19)}.card.glow{border-color:rgba(160,89,255,.28);box-shadow:0 12px 35px rgba(0,0,0,.22),inset 0 0 35px rgba(142,53,255,.035)}
.row{display:flex;gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;padding:13px 7px}.stat b{font-family:"Barlow Condensed",sans-serif;font-size:28px;display:block}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.btn{border:0;border-radius:15px;padding:12px 14px;background:#1a1821;color:white;font-weight:800;transition:.14s;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));box-shadow:0 10px 30px rgba(143,53,255,.25)}.btn.outline{background:rgba(13,13,18,.66);border:1px solid var(--line);backdrop-filter:blur(10px)}.btn.good{background:rgba(23,85,50,.54);border:1px solid rgba(66,215,125,.38)}.btn.bad{background:rgba(103,24,35,.6);border:1px solid rgba(255,83,100,.36)}.btn.warn{background:rgba(103,74,15,.52);border:1px solid rgba(255,189,61,.34)}.btn.blue{background:rgba(29,61,105,.55);border:1px solid rgba(93,156,255,.33)}.btn.wide{width:100%}.btn.sm{font-size:11px;padding:9px 10px}.btn.ghost{background:transparent;border:1px dashed rgba(255,255,255,.16);color:#c8c4cf}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;border:1px solid rgba(255,255,255,.14);padding:7px 10px;border-radius:999px;background:rgba(14,14,19,.74);color:#ddd9e4}.chip.active{border-color:#9d5cff;background:rgba(89,39,146,.4)}.chip.good{border-color:rgba(66,215,125,.4);background:rgba(27,83,50,.35)}.chip.bad{border-color:rgba(255,83,100,.4);background:rgba(90,25,33,.35)}
.list{display:flex;flex-direction:column;gap:9px}.member{display:flex;align-items:center;gap:12px}.avatar{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,#2e243e,#121219);display:grid;place-items:center;font-weight:900;border:1px solid rgba(255,255,255,.12);flex:0 0 auto;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.member .info{min-width:0;flex:1}.member .info b{display:block;font-size:14px}.member .info span{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:9px;letter-spacing:1.15px;font-weight:900;border-radius:999px;padding:6px 8px;border:1px solid #555}.role.owner{color:#d8c4ff;border-color:#8f35ff}.role.admin{color:#f2c2ff;border-color:#c028e9}.role.mod{color:#c3d8ff;border-color:#5d9cff}.role.memberr{color:#c7c4cb}
.event{display:flex;gap:12px;align-items:flex-start}.eventicon{width:56px;height:56px;border-radius:17px;background:linear-gradient(135deg,#4c1b89,#c028e9);display:grid;place-items:center;font-size:24px;flex:0 0 auto}.eventmain{flex:1;min-width:0}.eventmain h3{margin:0;font-size:15px}.eventmain p{margin:5px 0;color:var(--muted);font-size:11px;line-height:1.4}
.announcement{position:relative;border-left:3px solid var(--purple)}.announcement.urgent{border-left-color:var(--red)}.announcement .meta{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:10px}.announcement h3{font-size:17px;margin:7px 0 6px}.announcement p{margin:0;color:#d2ced7;line-height:1.45;font-size:13px}.announceFacts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.fact{font-size:10px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);color:#d7d2dc}.unreadDot{width:9px;height:9px;border-radius:50%;background:#ad54ff;box-shadow:0 0 12px #9b42ff;display:inline-block;margin-right:5px}
.reactionbar{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.react{border:1px solid rgba(255,255,255,.12);background:rgba(20,19,26,.72);color:#e9e6ee;border-radius:999px;padding:7px 10px;font-size:11px}.react.active{background:rgba(82,41,132,.58);border-color:#8f55e9}
.map{height:360px;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 15px 45px rgba(0,0,0,.25)}.map.smallMap{height:235px}.leaflet-container{background:#0d0c10}.liveActions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.liveAction{min-height:70px;padding:8px 4px;font-size:10px;line-height:1.25}.liveAction strong{display:block;font-size:20px;margin-bottom:3px}.liveSummary{display:flex;align-items:center;gap:9px;margin:9px 0 0;padding:10px 12px;border-radius:16px;background:rgba(143,53,255,.08);border:1px solid rgba(143,53,255,.18)}
.bottom{position:fixed;z-index:100;bottom:0;left:50%;transform:translateX(-50%);width:min(640px,100%);padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:rgba(8,7,11,.91);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{border:0;background:transparent;color:#84808c;border-radius:15px;padding:7px 2px;font-size:9px;font-weight:700}.navbtn i{font-style:normal;font-size:21px;display:block;margin-bottom:3px}.navbtn.active{color:#cba9ff;background:linear-gradient(180deg,rgba(110,49,182,.25),rgba(110,49,182,.08))}
.fab{position:fixed;right:max(17px,calc((100vw - 640px)/2 + 17px));bottom:106px;z-index:95;width:59px;height:59px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-size:27px;box-shadow:0 16px 45px rgba(143,53,255,.38)}
.modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}.modalwrap.show{display:flex}.sheet{width:min(640px,100%);max-height:92dvh;overflow:auto;border-radius:30px 30px 0 0;background:linear-gradient(180deg,#15131d,#0b0b10);border:1px solid rgba(255,255,255,.13);padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -35px 100px rgba(0,0,0,.6)}.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:-18px;background:linear-gradient(180deg,#15131d 75%,transparent);z-index:5;padding:6px 0 10px}.sheethead h2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:28px;letter-spacing:.4px;margin:0}.close{border:1px solid rgba(255,255,255,.13);background:#1a1821;color:#fff;border-radius:50%;width:39px;height:39px;font-size:17px}
.field{margin:11px 0}.field label{font-size:11px;color:#aaa5b0;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(255,255,255,.14);background:#0c0c11;color:#fff;border-radius:15px;padding:13px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8f35ff;box-shadow:0 0 0 3px rgba(143,53,255,.12)}.fieldGroup{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}.switch{width:50px;height:29px;border-radius:999px;background:#2a2831;position:relative;border:0;flex:0 0 auto}.switch:after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;background:white;top:3px;left:3px;transition:.18s}.switch.on{background:linear-gradient(135deg,#6f33d7,#a946ec)}.switch.on:after{left:24px}.notice{padding:12px;border:1px solid rgba(255,190,61,.25);background:rgba(76,53,13,.31);color:#f2d78a;border-radius:15px;font-size:11px;line-height:1.45}.infoBox{padding:12px;border:1px solid rgba(93,156,255,.24);background:rgba(26,54,91,.28);color:#cfe0ff;border-radius:15px;font-size:11px;line-height:1.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:108px;background:#1b1822;border:1px solid rgba(255,255,255,.15);padding:12px 15px;border-radius:15px;z-index:500;display:none;box-shadow:var(--shadow);max-width:calc(100vw - 30px);font-size:12px}.toast.show{display:block}.toast.update{border-color:rgba(143,53,255,.5);box-shadow:0 10px 40px rgba(143,53,255,.22)}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo{aspect-ratio:1.15/1;border-radius:18px;overflow:hidden;background:#17151e;border:1px solid rgba(255,255,255,.12);position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photolabel{position:absolute;left:8px;bottom:8px;background:rgba(8,8,11,.78);backdrop-filter:blur(8px);font-size:9px;padding:5px 7px;border-radius:999px}.seg{display:flex;border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:4px;background:#0f0e14}.seg button{flex:1;border:0;border-radius:11px;padding:9px;background:transparent;color:var(--muted);font-size:11px}.seg button.active{background:rgba(109,49,178,.42);color:white}.adminOnly{display:none}.isAdmin .adminOnly{display:block}.ownerOnly{display:none}.isOwner .ownerOnly{display:block}
.notificationItem{cursor:pointer;position:relative}.notificationItem.unread{border-color:rgba(143,53,255,.42);background:linear-gradient(145deg,rgba(56,30,85,.42),rgba(15,14,20,.88))}.notifActions{display:flex;gap:7px;margin-top:10px}.readGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.personState{padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:11px}.personState.seen{border-color:rgba(66,215,125,.22)}.personState.unseen{border-color:rgba(255,83,100,.2)}
.versionBadge{font-family:"Barlow Condensed",sans-serif;letter-spacing:1px;font-size:11px;color:#d6c1ff}.pulse{animation:pulse 1.8s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(143,53,255,.3)}50%{box-shadow:0 0 0 8px rgba(143,53,255,0)}}
@media(min-width:800px){.app{box-shadow:0 0 80px rgba(0,0,0,.8)}.fab{right:calc((100vw - 640px)/2 + 17px)}}
</style>

function deepMerge(base,extra){
 if(Array.isArray(base)) return Array.isArray(extra)?extra:base;
 if(base && typeof base==='object'){
  const out={...base};
  if(extra && typeof extra==='object') Object.keys(extra).forEach(k=>{out[k]=(k in base)?deepMerge(base[k],extra[k]):extra[k]});
  return out;
 }
 return extra===undefined?base:extra;
}
function migrateLegacy(old){
 const s=deepMerge(clone(seed),old||{});s.schema=2;
 s.announcements=(s.announcements||[]).map(a=>{
  if(a.responseOptions&&a.responses)return deepMerge({readBy:[],confirmedBy:[],hiddenBy:[],date:'',time:'',place:'',lat:null,lng:null,confirmRequired:false},a);
  const reactions=a.reactions||{};const responses={};const options=[];let readBy=[];
  Object.entries(reactions).forEach(([k,v])=>{if(/gelesen/i.test(k)){readBy=[...new Set([...readBy,...v])]}else{const clean=k.replace(/^\S+\s*/, '').trim()||k;options.push(clean);responses[clean]=v||[]}});
  if(!options.length){options.push('Dabei','Vielleicht','Nein');responses.Dabei=[];responses.Vielleicht=[];responses.Nein=[]}
  return {...a,date:'',time:'',place:'',lat:null,lng:null,responseOptions:options,responses,readBy,confirmedBy:[],hiddenBy:[],confirmRequired:!!a.confirm};
 });
 s.live=deepMerge(clone(seed.live),s.live||{});
 return s;
}
function loadState(){

 }catch(e){}
 return clone(seed);
}

function eventCard(e){if(!e)return '<div class="card muted">Noch kein Treffen geplant.</div>';const mine=e.rsvp?.[me().id]||'none';return `<div class="card event glow"><div class="eventicon">${e.type==='Ausfahrt'?'🏁':'☕'}</div><div class="eventmain"><h3>${esc(e.name)}</h3><p>${esc(e.date)} · ${esc(e.place)}</p>${e.lat?`<button class="btn sm outline" data-event-map="${e.id}">📍 Karten</button>`:''}<div class="actions"><button class="btn sm ${mine==='yes'?'primary':'outline'}" data-rsvp="yes" data-id="${e.id}">Dabei</button><button class="btn sm ${mine==='maybe'?'warn':'outline'}" data-rsvp="maybe" data-id="${e.id}">Vielleicht</button><button class="btn sm ${mine==='no'?'bad':'outline'}" data-rsvp="no" data-id="${e.id}">Nein</button></div></div></div>`}

function announcementCard(a,compact=false){if(!a)return '<div class="card muted">Keine Ankündigungen.</div>';const unread=!(a.readBy||[]).includes(me().id);const resp=myResponse(a);return `<div class="card announcement ${a.priority==='urgent'?'urgent':''} ${unread?'glow':''}">

${eta?`<div class="card glow" style="margin-top:10px"><div class="eyebrow">DEINE ANKUNFT</div><div style="font-family:'Barlow Condensed';font-size:28px;font-weight:800;margin-top:4px">${esc(eta.arrival)} · ${esc(eta.minutes)} Min.</div><div class="muted small">${esc(eta.distance)} km bis ${esc(state.live.target?.name||'Treffpunkt')}</div></div>`:''}
${section('Live-Karte',`<div id="map" class="map"></div><div class="liveActions"><button class="btn outline liveAction" data-live-status="Bin unterwegs"><strong>🚗</strong>Bin unterwegs</button><button class="btn outline liveAction" id="etaBtn"><strong>⏱</strong>ETA berechnen</button><button class="btn good liveAction" data-live-status="Bin da"><strong>📍</strong>Bin da</button><button class="btn warn liveAction" id="laterBtn"><strong>🕒</strong>Dann bin ich da</button><button class="btn bad liveAction" data-live-status="Panne"><strong>🆘</strong>Panne</button><button class="btn warn liveAction" data-live-status="Tankstopp"><strong>⛽</strong>Tankstopp</button><button class="btn outline liveAction" data-live-status="Crew verloren"><strong>👋</strong>Crew verloren</button><button class="btn outline liveAction" id="statusReset"><strong>↺</strong>Status reset</button></div>`)}

${section('Gerade aktiv',`<div class="list">${[...(state.live.share?[{name:me().name,status:state.live.status,lat:state.live.myLat,lng:state.live.myLng}]:[]),...state.live.markers].map(m=>`<div class="card member"><div class="avatar">📍</div><div class="info"><b>${esc(m.name)}</b><span>${esc(m.status)}</span></div><span class="chip active">LIVE</span></div>`).join('')}</div>`)}
`;
setTimeout(initMap,40);$('#shareLocation').onclick=()=>state.live.share?resetLiveStatus():openStatus();$('#etaBtn').onclick=calculateEta;$('#laterBtn').onclick=openArrivalTime;$('#statusReset').onclick=resetLiveStatus;$('#targetBtn').onclick=openTargetPicker;$('#statusBtn').onclick=openStatus;$('#liveWa').onclick=openWhatsApp;view.querySelectorAll('[data-live-status]').forEach(b=>b.onclick=()=>quickLiveStatus(b.dataset.liveStatus))}
function liveRemaining(){if(!state.live.share||!state.live.expiresAt)return '';const ms=state.live.expiresAt-Date.now();if(ms<=0)return '';const m=Math.ceil(ms/60000);return m<60?`${m} Min.`:`${Math.floor(m/60)} Std. ${m%60} Min.`}
function initMap(){if(!window.L||!$('#map'))return;map=L.map('map',{zoomControl:false}).setView([49.48,8.53],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);state.live.markers.forEach(m=>L.marker([m.lat,m.lng]).addTo(map).bindPopup(`<b>${esc(m.name)}</b><br>${esc(m.status)}`));if(state.live.target)L.circleMarker([state.live.target.lat,state.live.target.lng],{radius:9,color:'#9d58ff',fillColor:'#9d58ff',fillOpacity:.55}).addTo(map).bindPopup(`<b>Ziel:</b> ${esc(state.live.target.name)}`);if(state.live.share&&state.live.myLat&&state.live.myLng){L.marker([state.live.myLat,state.live.myLng]).addTo(map).bindPopup(`<b>${esc(me().name)}</b><br>${esc(state.live.status)}`);map.setView([state.live.myLat,state.live.myLng],13)}else if(state.live.share)refreshMyLocation(false)}
function setLiveStatus(status,duration=60){state.live.status=status;state.live.share=status!=='Unsichtbar';state.live.expiresAt=state.live.share&&duration?Date.now()+duration*60000:null;if(!state.live.share){state.live.eta=null;state.live.myLat=null;state.live.myLng=null}save();if(state.live.share)refreshMyLocation(false);render();toast(state.live.share?`Status: ${status}`:'Live-Status zurückgesetzt')}
function quickLiveStatus(status){const duration=(status==='Panne'||status==='Crew verloren')?120:60;setLiveStatus(status,duration)}
function resetLiveStatus(){state.live.share=false;state.live.status='Unsichtbar';state.live.expiresAt=null;state.live.eta=null;state.live.myLat=null;state.live.myLng=null;save();render();toast('Status zurückgesetzt')}
function openStatus(){openModal('Live-Status & Dauer',`
<div class="field"><label>Status</label><select id="liveStatusSelect"><option>Bin unterwegs</option><option>Bin da</option><option>Komme später</option><option>Spontanes Treffen?</option><option>Fotos machen</option><option>Tankstopp</option><option>Panne</option><option>Crew verloren</option></select></div>
<div class="field"><label>Automatisch zurücksetzen nach</label><select id="liveDuration"><option value="15">15 Minuten</option><option value="30">30 Minuten</option><option value="60" selected>1 Stunde</option><option value="120">2 Stunden</option><option value="240">4 Stunden</option><option value="0">Erst wenn ich manuell zurücksetze</option></select></div>
<div class="actions"><button class="btn primary" id="activateLive">Live setzen</button><button class="btn bad" id="resetLive">Status zurücksetzen</button></div>
<div class="notice" style="margin-top:12px">Standortfreigabe bleibt immer freiwillig. Wenn eine Zeit gewählt ist, schaltet die App den Status automatisch zurück.</div>`,()=>{$('#activateLive').onclick=()=>{const d=Number($('#liveDuration').value);closeModal();setLiveStatus($('#liveStatusSelect').value,d)};$('#resetLive').onclick=()=>{closeModal();resetLiveStatus()}})}
function openArrivalTime(){openModal('Wann bist du da?',`<div class="field"><label>Geplante Ankunft</label><input id="arrivalTime" type="time" /></div><div class="field"><label>Status automatisch löschen</label><select id="arrivalExpire"><option value="30">30 Min. nach Ankunft</option><option value="60" selected>1 Std. nach Ankunft</option><option value="120">2 Std. nach Ankunft</option></select></div><button class="btn primary wide" id="saveArrival">Ankunft teilen</button>`,()=>{const d=new Date();d.setMinutes(d.getMinutes()+30);$('#arrivalTime').value=d.toTimeString().slice(0,5);$('#saveArrival').onclick=()=>{const t=$('#arrivalTime').value;if(!t)return toast('Zeit fehlt');const [h,m]=t.split(':').map(Number);const when=new Date();when.setHours(h,m,0,0);if(when<Date.now())when.setDate(when.getDate()+1);const extra=Number($('#arrivalExpire').value);state.live.status=`Bin um ${t} da`;state.live.share=true;state.live.expiresAt=when.getTime()+extra*60000;state.live.eta={arrival:t,minutes:Math.max(0,Math.round((when-Date.now())/60000)),distance:'—'};save();closeModal();refreshMyLocation(false);render()}})}
function refreshMyLocation(showToast=true){if(!navigator.geolocation){if(showToast)toast('Standort wird nicht unterstützt');return Promise.reject()}return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(p=>{state.live.myLat=p.coords.latitude;state.live.myLng=p.coords.longitude;save();if(showToast)toast('Standort aktualisiert');resolve(p.coords)},e=>{if(showToast)toast('Standortfreigabe nicht erlaubt');reject(e)},{enableHighAccuracy:true,timeout:10000,maximumAge:30000}))}
async function calculateEta(){if(!state.live.target)return openTargetPicker();let coords;try{coords=await refreshMyLocation(false)}catch{return toast('Für ETA brauchen wir deinen Standort')};const t=state.live.target;let minutes,distance;try{const u=`https://router.project-osrm.org/route/v1/driving/${coords.longitude},${coords.latitude};${t.lng},${t.lat}?overview=false`;const res=await fetch(u);const data=await res.json();if(data.code!=='Ok'||!data.routes?.[0])throw 0;minutes=Math.max(1,Math.round(data.routes[0].duration/60));distance=(data.routes[0].distance/1000).toFixed(1)}catch{distance=haversine(coords.latitude,coords.longitude,t.lat,t.lng).toFixed(1);minutes=Math.max(1,Math.round(Number(distance)/45*60))}const arr=new Date(Date.now()+minutes*60000);const arrival=arr.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});state.live.share=true;state.live.status=`Bin unterwegs · ETA ${arrival}`;state.live.expiresAt=Date.now()+(minutes+45)*60000;state.live.eta={arrival,minutes,distance};save();render();toast(`ETA ${arrival} berechnet`)}
function haversine(a,b,c,d){const R=6371,rad=x=>x*Math.PI/180;const da=rad(c-a),db=rad(d-b);const q=Math.sin(da/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function openTargetPicker(){openModal('Ziel / Treffpunkt',`<div class="list">${state.events.filter(e=>e.lat).map(e=>`<button class="btn outline" data-target-event="${e.id}">📍 ${esc(e.name)} – ${esc(e.place)}</button>`).join('')}</div><div class="section"><div class="sectionhead"><h2>Eigenes Ziel</h2></div><div class="field"><label>Name</label><input id="targetName" placeholder="z. B. Waschpark" /></div><div class="infoBox">Tippe auf die Karte, um den Zielpunkt zu setzen.</div><div id="targetMap" class="map smallMap" style="margin-top:8px"></div><button class="btn primary wide" id="saveTarget" style="margin-top:9px">Ziel übernehmen</button></div>`,()=>{sheet.querySelectorAll('[data-target-event]').forEach(b=>b.onclick=()=>{const e=state.events.find(x=>x.id===b.dataset.targetEvent);state.live.target={name:e.place||e.name,lat:e.lat,lng:e.lng};state.live.eta=null;save();closeModal();render();toast('Ziel gesetzt')});let pin={lat:state.live.target?.lat||49.48,lng:state.live.target?.lng||8.53};modalMap=L.map('targetMap').setView([pin.lat,pin.lng],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(modalMap);let marker=L.marker([pin.lat,pin.lng],{draggable:true}).addTo(modalMap);const set=(lat,lng)=>{pin={lat,lng};marker.setLatLng([lat,lng])};modalMap.on('click',e=>set(e.latlng.lat,e.latlng.lng));marker.on('dragend',()=>{const p=marker.getLatLng();set(p.lat,p.lng)});$('#saveTarget').onclick=()=>{state.live.target={name:$('#targetName').value.trim()||'Eigener Treffpunkt',lat:pin.lat,lng:pin.lng};state.live.eta=null;save();closeModal();render()}})}

function openMember(id){const u=state.users.find(x=>x.id===id);if(!u)return;const protectedOwner=u.role==='owner';openModal(u.name,`<div class="card"><div class="member"><div class="avatar">${u.emoji}</div><div class="info"><b>${esc(u.name)}</b><span>${esc(u.car)} · ${esc(u.ig)}</span></div><span class="role ${roleClass(u.role)}">${roleLabel(u.role)}</span></div></div>${protectedOwner?'<div class="notice" style="margin-top:12px">🔒 Der Owner kann nicht herabgestuft oder entfernt werden.</div>':`<div class="field"><label>Rolle</label><select id="roleSel"><option value="member" ${u.role==='member'?'selected':''}>Mitglied</option><option value="moderator" ${u.role==='moderator'?'selected':''}>Moderator</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div><button class="btn primary wide" id="saveRole">Rolle speichern</button><button class="btn bad wide" id="removeMember" style="margin-top:8px">Mitglied entfernen</button>`}`,()=>{if(!protectedOwner){$('#saveRole').onclick=()=>{if(!isOwner()&&$('#roleSel').value==='admin')return toast('Nur der Owner darf Admin-Rechte vergeben');u.role=$('#roleSel').value;state.audit.unshift(`${me().name} änderte ${u.name} auf ${roleLabel(u.role)}`);save();closeModal();render()};$('#removeMember').onclick=()=>{state.users=state.users.filter(x=>x.id!==u.id);state.audit.unshift(`${me().name} hat ${u.name} entfernt`);save();closeModal();render()}}})}

function openQuickCreate(){openModal('Neu erstellen',`<div class="grid2"><button class="btn primary" id="qcAnn">📢 Ankündigung</button><button class="btn outline" id="qcMeet">⚡ Treffen</button><button class="btn outline" id="qcInvite">👤 Einladung</button><button class="btn outline" id="qcPhoto">📸 Galerie</button></div>`,()=>{$('#qcAnn').onclick=()=>{closeModal();openAnnouncement()};$('#qcMeet').onclick=()=>{closeModal();openMeet()};$('#qcInvite').onclick=()=>{closeModal();openInvite()};$('#qcPhoto').onclick=()=>{closeModal();openGallery()}})}

function openAnnouncement(){let responseOptions=['Dabei','Vielleicht','Nein'];let pin={lat:null,lng:null};openModal('Ankündigung erstellen',`
<div class="field"><label>Titel</label><input id="annTitle" placeholder="z. B. Treffen heute" /></div>
<div class="field"><label>Nachricht</label><textarea id="annBody" placeholder="Was sollen alle wissen?"></textarea></div>
<div class="fieldGroup"><div class="field"><label>Datum</label><input id="annDate" type="date" /></div><div class="field"><label>Uhrzeit</label><input id="annTime" type="time" /></div></div>
<div class="field"><label>Ort / Treffpunkt</label><input id="annPlace" placeholder="z. B. Waschpark Brühl" /></div>
<div class="section"><div class="sectionhead"><h2>Standort markieren</h2><button class="btn sm outline" id="myAnnLocation">Meine Position</button></div><div class="infoBox">Optional: Tippe auf die Karte oder verschiebe den Pin. Mitglieder bekommen danach Buttons für Apple Karten und Google Maps.</div><div id="annMap" class="map smallMap" style="margin-top:8px"></div></div>
<div class="field"><label>Priorität</label><select id="annPriority"><option value="normal">Normal</option><option value="important" selected>Wichtig</option><option value="urgent">Dringend</option></select></div>
<div class="section"><div class="sectionhead"><h2>Antwortmöglichkeiten</h2></div><div class="chips" id="responseChips"></div><div class="fieldGroup" style="margin-top:8px"><div class="field"><input id="responseInput" placeholder="Eigene Antwort" /></div><div class="field"><button class="btn outline wide" id="addResponse">＋ Hinzufügen</button></div></div><div class="chips"><button class="chip" data-preset="Dabei">Dabei</button><button class="chip" data-preset="Vielleicht">Vielleicht</button><button class="chip" data-preset="Nein">Nein</button><button class="chip" data-preset="Komme später">Komme später</button><button class="chip" data-preset="Gelesen">Gelesen</button></div></div>
<div class="switchrow"><span><b>Bestätigung erforderlich</b><div class="muted tiny">zusätzlich zu normalem Lesestatus</div></span><button class="switch" id="confirmSwitch"></button></div>
<div class="switchrow"><span><b>Push senden</b><div class="muted tiny">in Produktion an alle gewählten Mitglieder</div></span><button class="switch on" id="pushSwitch"></button></div>
<button class="btn primary wide" id="saveAnn" style="margin-top:12px">Veröffentlichen</button>
`,()=>{
 let conf=false,push=true;const center=[49.48,8.53];modalMap=L.map('annMap').setView(center,11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(modalMap);let marker=null;const setPin=(lat,lng)=>{pin={lat,lng};if(marker)marker.setLatLng([lat,lng]);else{marker=L.marker([lat,lng],{draggable:true}).addTo(modalMap);marker.on('dragend',()=>{const p=marker.getLatLng();pin={lat:p.lat,lng:p.lng}})}};modalMap.on('click',e=>setPin(e.latlng.lat,e.latlng.lng));
 const renderResponses=()=>{$('#responseChips').innerHTML=responseOptions.map((o,i)=>`<button class="chip active" data-remove-response="${i}">${esc(o)} ✕</button>`).join('');$('#responseChips').querySelectorAll('[data-remove-response]').forEach(b=>b.onclick=()=>{responseOptions.splice(Number(b.dataset.removeResponse),1);renderResponses()})};renderResponses();
 $('#addResponse').onclick=()=>{const v=$('#responseInput').value.trim();if(v&&!responseOptions.includes(v))responseOptions.push(v);$('#responseInput').value='';renderResponses()};sheet.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const v=b.dataset.preset;if(!responseOptions.includes(v))responseOptions.push(v);renderResponses()});
 $('#myAnnLocation').onclick=()=>{if(!navigator.geolocation)return toast('Standort nicht verfügbar');navigator.geolocation.getCurrentPosition(p=>{setPin(p.coords.latitude,p.coords.longitude);modalMap.setView([p.coords.latitude,p.coords.longitude],15);toast('Standort übernommen')},()=>toast('Standort nicht erlaubt'),{enableHighAccuracy:true,timeout:8000})};
 $('#confirmSwitch').onclick=()=>{conf=!conf;$('#confirmSwitch').classList.toggle('on',conf)};$('#pushSwitch').onclick=()=>{push=!push;$('#pushSwitch').classList.toggle('on',push)};
 $('#saveAnn').onclick=()=>{const title=$('#annTitle').value.trim(),body=$('#annBody').value.trim();if(!title||!body)return toast('Titel und Nachricht fehlen');const responses={};responseOptions.forEach(o=>responses[o]=[]);const a={id:'a'+Date.now(),title,body,priority:$('#annPriority').value,created:'Gerade eben',date:$('#annDate').value,time:$('#annTime').value,place:$('#annPlace').value.trim(),lat:pin.lat,lng:pin.lng,responseOptions:[...responseOptions],responses,readBy:[me().id],confirmedBy:conf?[me().id]:[],confirmRequired:conf,hiddenBy:[]};state.announcements.unshift(a);state.audit.unshift(`${me().name} hat Ankündigung „${title}“ veröffentlicht`);save();closeModal();page='announce';render();if(push)pushTest(title,body,true);toast('Ankündigung veröffentlicht')}
 })}

function openMeet(){if(!isAdmin())return toast('Nur Admins können Treffen erstellen');openModal('Spontanes Treffen',`<div class="field"><label>Name</label><input id="meetName" value="Spontanes Treffen" /></div><div class="field"><label>Ort</label><input id="meetPlace" placeholder="z. B. Waschpark" /></div><div class="field"><label>Wann?</label><input id="meetDate" value="Heute · 19:30" /></div><div class="infoBox">Für die Live-ETA kann der Treffpunkt später direkt auf der Karte als Ziel gesetzt werden.</div><button class="btn primary wide" id="saveMeet" style="margin-top:10px">Treffen erstellen</button>`,()=>$('#saveMeet').onclick=()=>{state.events.unshift({id:'e'+Date.now(),name:$('#meetName').value||'Spontanes Treffen',date:$('#meetDate').value||'Heute',place:$('#meetPlace').value||'Treffpunkt folgt',lat:null,lng:null,type:'Treffen',rsvp:{[me().id]:'yes'}});save();closeModal();render();toast('Treffen erstellt')})}
function openEventsList(){openModal('Treffen & Events',`<div class="list">${state.events.map(eventCard).join('')}</div>`,()=>bindAnnouncementActions(sheet))}
function openEventMaps(id){const e=state.events.find(x=>x.id===id);if(e?.lat)openMapsChoice(e.lat,e.lng,e.place||e.name)}
function openMapsForAnnouncement(id){const a=state.announcements.find(x=>x.id===id);if(a?.lat)openMapsChoice(a.lat,a.lng,a.place||a.title)}
function openMapsChoice(lat,lng,label){openModal('Route öffnen',`<div class="card"><b>📍 ${esc(label)}</b><div class="muted small">${lat.toFixed(5)}, ${lng.toFixed(5)}</div></div><div class="grid2" style="margin-top:10px"><button class="btn outline" id="appleChoice"> Karten</button><button class="btn outline" id="googleChoice">Google Maps</button></div>`,()=>{$('#appleChoice').onclick=()=>openMapUrl('apple',lat,lng,label);$('#googleChoice').onclick=()=>openMapUrl('google',lat,lng,label)})}
function openMapUrl(type,lat,lng,label='Ziel'){const q=encodeURIComponent(label);const url=type==='apple'?`https://maps.apple.com/?q=${q}&ll=${lat},${lng}`:`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;window.open(url,'_blank','noopener')}

function openInvite(){openModal('Mitglied einladen',`<div class="notice">Später erzeugt die App einen sicheren Einladungslink + QR-Code. Für den Trockentest simulieren wir eine Bewerbung.</div><div class="field"><label>Name</label><input id="invName" /></div><div class="field"><label>Fahrzeug</label><input id="invCar" /></div><button class="btn primary wide" id="simInvite">Bewerbung simulieren</button>`,()=>$('#simInvite').onclick=()=>{state.applications.unshift({id:'app'+Date.now(),name:$('#invName').value||'Neues Mitglied',car:$('#invCar').value||'Fahrzeug offen',text:'Möchte der Crew beitreten.'});save();closeModal();page='crew';render()})}
function openProfileSwitch(){openModal('Testprofil wechseln',`<div class="list">${state.users.map(u=>`<button class="btn outline member" data-switch="${u.id}"><span class="avatar">${u.emoji}</span><span class="info" style="text-align:left"><b>${esc(u.name)}</b><span>${roleLabel(u.role)}</span></span></button>`).join('')}</div><button class="btn ghost wide" id="editProfile" style="margin-top:10px">Mein Profil bearbeiten</button>`,()=>{sheet.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{state.currentUser=b.dataset.switch;save();closeModal();render();toast(`Jetzt als ${me().name}`)});$('#editProfile').onclick=()=>{closeModal();openMyProfile()}})}
function openMyProfile(){openModal('Mein Profil',`<div class="card"><div class="member"><div class="avatar">${me().emoji}</div><div class="info"><b>${esc(me().name)}</b><span>${roleLabel(me().role)}</span></div></div></div><div class="field"><label>Fahrzeug</label><input id="myCar" value="${esc(me().car)}" /></div><div class="field"><label>Instagram</label><input id="myIg" value="${esc(me().ig)}" /></div><button class="btn primary wide" id="saveProfile">Speichern</button>`,()=>$('#saveProfile').onclick=()=>{me().car=$('#myCar').value;me().ig=$('#myIg').value;save();closeModal();render()})}

function openGallery(){openModal('Crew Galerie',`<div class="notice">Im aktuellen Trockentest bleiben Fotos nur auf diesem Gerät. Später liegen sie im Crew-Cloudspeicher und werden automatisch den Fahrzeugen zugeordnet.</div><div class="gallery" style="margin-top:12px">${state.photos.length?state.photos.map(p=>`<div class="photo"><img src="${p.data}" alt="Crew Foto"><span class="photolabel">${esc(p.label||'Crew Foto')}</span></div>`).join(''):'<div class="card muted" style="grid-column:1/-1">Noch keine eigenen Fotos hochgeladen.</div>'}</div><label class="btn primary wide" style="display:block;text-align:center;margin-top:12px">＋ Fotos hochladen<input id="photoInput" type="file" accept="image/*" multiple hidden></label><button class="btn outline wide" id="scanPhotos" style="margin-top:8px">✨ Fahrzeuge erkennen (Demo)</button>`,()=>{$('#photoInput').onchange=e=>handlePhotos(e.target.files);$('#scanPhotos').onclick=()=>{if(!state.photos.length)return toast('Erst mindestens ein Foto hochladen');state.photos.forEach((p,i)=>p.label=['Steve erkannt','Max erkannt','Leni erkannt','Crew-Fahrzeug'][i%4]);save();closeModal();openGallery();toast('Demo-Erkennung abgeschlossen')}})}
function handlePhotos(files){[...files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=()=>{state.photos.unshift({data:r.result,label:'Neu'});state.photos=state.photos.slice(0,10);save();closeModal();openGallery()};r.readAsDataURL(f)})}
function openSocial(){const recognized=state.photos.filter(p=>p.label?.includes('erkannt')).map(p=>p.label.replace(' erkannt',''));openModal('Social Media Studio',`<div class="eyebrow">INSTAGRAM POST</div><div class="field"><label>Caption</label><textarea id="caption">Night Drive mit 4 Wheels One Family 🌙\nGute Autos. Bessere Menschen. Immer gemeinsam unterwegs.\n#4WheelsOneFamily #CarCrew</textarea></div><div class="card"><b>Erkannte Mitglieder</b><div class="chips" style="margin-top:10px">${recognized.length?recognized.map(n=>`<span class="chip active">${esc(n)}</span>`).join(''):'<span class="muted small">Noch keine Fahrzeugerkennung durchgeführt.</span>'}</div></div><div class="actions"><button class="btn outline" id="regenCap">✨ Caption neu</button><button class="btn primary" id="saveDraft">Entwurf speichern</button></div><div class="notice" style="margin-top:12px">Echtes Instagram-Publishing wird mit der Meta-API verbunden. Die Crew-App bereitet Auswahl, Erkennung, Caption und Freigabe vor.</div>`,()=>{$('#regenCap').onclick=()=>{$('#caption').value='Same roads. Same family. 💜\n4 Wheels One Family unterwegs – mehr als nur eine Crew.\n#4WheelsOneFamily #NightDrive #CarCommunity'};$('#saveDraft').onclick=()=>toast('Social-Entwurf gespeichert')})}
function openWhatsApp(){if(state.whatsapp){location.href=state.whatsapp;return}openModal('WhatsApp',`<div class="notice">Hinterlege einmal den Einladungslink eurer WhatsApp-Gruppe. Danach öffnet der Button direkt eure Gruppe.</div><div class="field"><label>WhatsApp-Gruppenlink</label><input id="waLink" placeholder="https://chat.whatsapp.com/..." /></div><button class="btn primary wide" id="saveWa">Speichern</button>`,()=>$('#saveWa').onclick=()=>{state.whatsapp=$('#waLink').value.trim();save();closeModal();toast('WhatsApp-Link gespeichert')})}

function openInstall(){const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(standalone)return openModal('App installiert',`<div class="card"><b>✅ Die Crew-App läuft bereits als App.</b><p class="muted small">Künftige Updates werden automatisch über dieselbe Installation übernommen.</p></div>`);const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),android=/Android/.test(ua);openModal('App installieren',`<div class="card"><b>${ios?'🍎 iPhone erkannt':android?'🤖 Android erkannt':'💻 Gerät erkannt'}</b><p class="muted small">${ios?'In Safari: Teilen → Zum Home-Bildschirm → Hinzufügen. Danach ist keine Neuinstallation bei Updates nötig.':android?'In Chrome: Browser-Menü → App installieren / Zum Startbildschirm hinzufügen.':'Im Browser kann die App über „Installieren“ hinzugefügt werden.'}</p></div>${deferredInstall?'<button class="btn primary wide" id="nativeInstall" style="margin-top:10px">Jetzt installieren</button>':''}<div class="infoBox" style="margin-top:10px">Nach der ersten Installation prüft die App selbstständig auf neue Versionen und übernimmt Updates im Hintergrund.</div>`,()=>{if($('#nativeInstall'))$('#nativeInstall').onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;closeModal()}})}

async function pushTest(title='4 Wheels One Family',body='Test-Push: Neue Crew-Nachricht.',silent=false){if(!('Notification'in window)){if(!silent)toast('Benachrichtigungen werden hier nicht unterstützt');return}const p=await Notification.requestPermission();if(p!=='granted'){if(!silent)toast('Benachrichtigungen nicht erlaubt');return}try{const reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body,tag:'4w1f-demo'});state.settings.push=true;save();if(!silent)toast('Test-Benachrichtigung gesendet')}catch{if(!silent)toast('Push-Test konnte nicht angezeigt werden')}}
function openAudit(){openModal('Admin Audit-Log',`<div class="list">${state.audit.map(x=>`<div class="card small">${esc(x)}</div>`).join('')}</div>`)}
function openBackup(){openModal('Backup & Restore',`<div class="notice">Sichert den kompletten lokalen Trockentest-Zustand.</div><div class="actions"><button class="btn primary" id="exportData">Backup kopieren</button><button class="btn outline" id="resetData">Demo zurücksetzen</button></div><div class="field"><label>Backup JSON importieren</label><textarea id="importJson"></textarea></div><button class="btn outline wide" id="importData">Importieren</button>`,()=>{$('#exportData').onclick=async()=>{await navigator.clipboard?.writeText(JSON.stringify(state));toast('Backup kopiert')};$('#resetData').onclick=()=>{state=clone(seed);save();closeModal();render();toast('Demo zurückgesetzt')};$('#importData').onclick=()=>{try{state=deepMerge(clone(seed),JSON.parse($('#importJson').value));save();closeModal();render();toast('Backup importiert')}catch{toast('Ungültiges Backup')}}})}

async function checkForUpdates(manual=false){try{const res=await fetch(`./version.json?t=${Date.now()}`,{cache:'no-store'});const v=await res.json();if(v.version!==APP_VERSION){if(manual)toast(`Update ${v.version} wird geladen…`,'update');await updateRegistration?.update();return false}if(manual)toast(`App ist aktuell · V${APP_VERSION}`,'update');return true}catch{if(manual)toast('Update-Prüfung gerade nicht möglich');return false}}
function initUpdates(){if(!('serviceWorker'in navigator))return;navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{updateRegistration=reg;reg.update().catch(()=>{});checkForUpdates(false);setInterval(()=>checkForUpdates(false),5*60*1000)}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem('4w1f-reloading'))return;sessionStorage.setItem('4w1f-reloading','1');location.reload()});navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='SW_ACTIVATED'&&e.data.version!==localStorage.getItem('4w1f-last-version'))localStorage.setItem('4w1f-last-version',e.data.version)});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){sessionStorage.removeItem('4w1f-reloading');updateRegistration?.update().catch(()=>{});checkForUpdates(false)}});const last=localStorage.getItem('4w1f-display-version');if(last&&last!==APP_VERSION)setTimeout(()=>toast(`Update installiert – Version ${APP_VERSION} ✅`,'update'),700);localStorage.setItem('4w1f-display-version',APP_VERSION)}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
$('#notifBtn').onclick=showNotifications;$('#profileBtn').onclick=openProfileSwitch;
setInterval(()=>{if(expireLiveIfNeeded()&&page==='live')render()},30000);
try{initUpdates();render()}catch(err){console.error('4W1F startup error',err);const v=document.querySelector('#view');if(v)v.innerHTML='<div style="margin:20px;padding:18px;border:1px solid #5b2a72;border-radius:18px;background:#151019;color:#fff"><b>App konnte nicht vollständig starten.</b><div style="margin-top:8px;color:#aaa">Bitte neu laden. Fehlercode: START-111</div></div>';}
</script>
</body>
</html>

function openProject(id){const p=state.projects.find(x=>x.id===id);if(!p)return;openModal(p.title,`<div class="card project-card"><div class="project-icon">${p.icon}</div><span class="project-status ${p.status}">${esc(p.statusLabel)}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>${p.id==='pyoutube'?`<div class="notice">Der Kanal ist bewusst noch nicht verlinkt. Sobald er existiert, erscheint hier automatisch der direkte Button.</div>`:''}${p.id==='psticker'?`<div class="notice">Sticker bleiben als Projekt sichtbar, ohne eine fertige Bestellung vorzutäuschen. Sobald Design/Anbieter feststehen, kann das Projekt auf „Abstimmung“ oder „Live“ gesetzt werden.</div>`:''}`)}
function openProjectsHub(){openModal('Crew Projekte',`<div class="projects-grid">${projectCards()}</div>`,()=>$$('[data-project]').forEach(b=>b.onclick=()=>{closeModal();openProject(b.dataset.project)}))}
function openMediaHub(){const yt=state.settings.youtube;const action=yt?`<button class="btn primary wide" id="openYoutube" style="margin-top:10px">▶ YouTube öffnen</button>`:`<div class="notice" style="margin-top:10px">Sobald euer Kanal steht, hinterlegt ein Admin nur einmal den Link.</div>`;openModal('Media Hub',`<div class="card media-hub"><div class="eyebrow">Crew Film</div><h3 style="font-size:22px;margin:5px 0">🎬 ${esc(state.media?.crewFilmTitle||'Crew Film')}</h3><div class="muted small">Status: ${esc(state.media?.crewFilmStatus||'Vorbereitung')}</div></div><div class="section card pad"><div class="eyebrow">YouTube</div><h3 style="margin:5px 0">4 Wheels 1 Family</h3><div class="muted small">${yt?'Kanal ist verknüpft.':'Kanal noch nicht veröffentlicht – der Bereich ist bereits vorbereitet.'}</div>${action}</div>`,()=>{const b=$('#openYoutube');if(b)b.onclick=()=>window.open(yt,'_blank')})}
function openMediaSettings(){openModal('Media & YouTube',`<div class="field"><label>Crew-Film Titel</label><input id="filmTitle" value="${esc(state.media?.crewFilmTitle||'')}"></div><div class="field"><label>Status</label><select id="filmStatus"><option>Vorbereitung</option><option>In Produktion</option><option>Schnitt</option><option>Bereit zur Veröffentlichung</option><option>Veröffentlicht</option></select></div><div class="field"><label>YouTube Kanal URL</label><input id="youtubeUrl" value="${esc(state.settings.youtube||'')}" placeholder="https://youtube.com/..."></div><div class="field"><label>Instagram URL</label><input id="instagramUrl" value="${esc(state.settings.instagram||'')}" placeholder="https://instagram.com/..."></div><button class="btn primary wide" id="saveMedia">Speichern</button>`,()=>{$('#filmStatus').value=state.media?.crewFilmStatus||'Vorbereitung';$('#saveMedia').onclick=()=>{state.media??={};state.media.crewFilmTitle=$('#filmTitle').value.trim()||'Crew Film';state.media.crewFilmStatus=$('#filmStatus').value;state.settings.youtube=$('#youtubeUrl').value.trim();state.settings.instagram=$('#instagramUrl').value.trim();save();closeModal();toast('Media Hub aktualisiert')}})}
function openProjectAdmin(){openModal('Crew Projekte',`<div class="list">${state.projects.map(p=>`<div class="card pad"><div class="project-admin-row"><div><b>${p.icon} ${esc(p.title)}</b><div class="muted tiny">${esc(p.text)}</div></div><select data-project-status="${p.id}"><option value="vote">Idee / geplant</option><option value="work">In Arbeit</option><option value="live">Live</option></select></div><div class="field"><label>Status-Text</label><input data-project-label="${p.id}" value="${esc(p.statusLabel)}"></div></div>`).join('')}</div><button class="btn primary wide" id="saveProjects">Änderungen speichern</button>`,()=>{state.projects.forEach(p=>{const sel=$(`[data-project-status="${p.id}"]`);if(sel)sel.value=p.status});$('#saveProjects').onclick=()=>{state.projects.forEach(p=>{p.status=$(`[data-project-status="${p.id}"]`).value;p.statusLabel=$(`[data-project-label="${p.id}"]`).value.trim()||p.statusLabel});save();closeModal();toast('Projektstatus gespeichert')}})}
function openCrewEditor(){openModal('Welcome & Crew DNA',`<div class="field"><label>Über die Crew</label><textarea id="crewAbout">${esc(state.crew.about)}</textarea></div><div class="field"><label>Regeln / Grundsätze · eine Zeile je Punkt</label><textarea id="crewRules">${esc(state.crew.rules.join('\n'))}</textarea></div><div class="switchrow"><span>Onboarding automatisch zeigen</span><button class="switch ${state.settings.welcomeAuto?'on':''}" id="autoWelcome"></button></div><button class="btn primary wide" id="saveCrewDna">Speichern</button>`,()=>{let auto=!!state.settings.welcomeAuto;$('#autoWelcome').onclick=()=>{auto=!auto;$('#autoWelcome').classList.toggle('on',auto)};$('#saveCrewDna').onclick=()=>{state.crew.about=$('#crewAbout').value.trim();state.crew.rules=$('#crewRules').value.split('\n').map(x=>x.trim()).filter(Boolean);state.settings.welcomeAuto=auto;save();closeModal();toast('Crew DNA gespeichert')}})}
function downloadICS(e){const now=new Date();const dateMatch=String(e.date).match(/(\d{1,2})\.\s*([A-Za-zÄÖÜäöü]{3,})\.?\s*(\d{4})/);let dt='20260922';if(dateMatch){const months={jan:1,feb:2,mär:3,apr:4,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dez:12};const m=months[dateMatch[2].slice(0,3).toLowerCase()]||9;dt=`${dateMatch[3]}${String(m).padStart(2,'0')}${String(dateMatch[1]).padStart(2,'0')}`}const t=(e.time||'12:00').replace(':','')+'00';const escI=x=>String(x||'').replace(/[,;]/g,'\\$&').replace(/\n/g,'\\n');const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//4W1F//Crew App//DE\r\nBEGIN:VEVENT\r\nUID:${e.id}-${Date.now()}@4w1f\r\nDTSTAMP:${now.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}\r\nDTSTART:${dt}T${t}\r\nSUMMARY:${escI(e.name)}\r\nLOCATION:${escI(e.place)}\r\nDESCRIPTION:${escI(e.tagline)}\r\nEND:VEVENT\r\nEND:VCALENDAR`;const blob=new Blob([ics],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${e.name.replace(/[^a-z0-9]+/gi,'-')}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function shareEvent(e){const text=`${e.name}\n${e.date} · ${e.time} Uhr\n${e.place}`;if(navigator.share){try{await navigator.share({title:e.name,text})}catch{}}else{await navigator.clipboard?.writeText(text);toast('Eventdaten kopiert')}}
function openSocialStudio(){openModal('Social Media Studio',`<div class="eyebrow">Instagram Post erstellen</div><div class="field"><label>Caption</label><textarea id="caption">Night Drive mit 4 Wheels 1 Family 🌙\nGute Autos. Bessere Menschen. Immer gemeinsam unterwegs.\n#4Wheels1Family #NightDrive #CarCommunity</textarea></div><div class="chips"><span class="chip active">#4Wheels1Family</span><span class="chip">#NightDrive</span><span class="chip">#CarMeet</span><span class="chip">#Family</span></div><div class="section card pad"><b>Erkannte Fahrzeuge & Mitglieder</b><div class="muted small" style="margin-top:7px">Demo: Steve · Max · Leni</div></div><div class="actions"><button class="btn outline">Entwurf speichern</button><button class="btn primary" id="postDemo">Jetzt posten</button></div><div class="notice">Echtes Posting wird später über die Meta-API angebunden. Zugangsdaten liegen niemals im Frontend.</div>`,()=>$('#postDemo').onclick=()=>toast('Meta-Verbindung ist noch nicht aktiv'))}
function openSecurityCenter(){openModal('Sicherheit',`<div class="notice">Der Prototyp hat bereits Frontend-Schutz. Echte Konten, Rollen und Standortdaten werden vor Crew-Start zusätzlich serverseitig abgesichert.</div><div class="card pad" style="margin-top:10px"><div class="security-line"><i class="security-dot"></i><div><b>Owner Lock</b><div class="muted tiny">Owner kann in der App nicht verändert werden</div></div></div><div class="security-line"><i class="security-dot"></i><div><b>Content Security Policy</b><div class="muted tiny">Fremdquellen und eingebettete Inhalte sind eingeschränkt</div></div></div><div class="security-line"><i class="security-dot"></i><div><b>Upload-Filter</b><div class="muted tiny">Nur definierte Bildtypen bis 12 MB</div></div></div><div class="security-line"><i class="security-dot"></i><div><b>Audit Log</b><div class="muted tiny">Admin-Aktionen werden protokolliert</div></div></div><div class="security-line"><i class="security-dot warn"></i><div><b>Server-Rollen & RLS</b><div class="muted tiny">Wird beim Cloud-Backend verbindlich aktiviert</div></div></div><div class="security-line"><i class="security-dot warn"></i><div><b>2FA für Owner/Admin</b><div class="muted tiny">Für Produktionsstart vorgesehen</div></div></div></div><button class="btn outline wide" id="auditOpen" style="margin-top:10px">Audit-Log öffnen</button>`,()=>$('#auditOpen').onclick=()=>openAudit())}
function openAudit(){openModal('Audit-Log',`<div class="list">${state.audit.map(x=>`<div class="card pad small">${esc(x)}</div>`).join('')}</div>`)}
function openBackupUpdates(){openModal('Backup & Updates',`<div class="card pad"><b>Version ${APP_VERSION}</b><div class="muted small">Build ${BUILD}</div></div><div class="actions"><button class="btn primary" id="checkUpdate">Jetzt auf Updates prüfen</button><button class="btn outline" id="copyBackup">Backup kopieren</button></div><div class="field"><label>Backup importieren</label><textarea id="backupJson"></textarea></div><button class="btn outline wide" id="importBackup">Importieren</button>`,()=>{$('#checkUpdate').onclick=()=>checkForUpdates(true);$('#copyBackup').onclick=async()=>{await navigator.clipboard?.writeText(JSON.stringify(state));toast('Backup kopiert')};$('#importBackup').onclick=()=>{try{state=normalize(JSON.parse($('#backupJson').value));save();closeModal();render();toast('Backup importiert')}catch{toast('Ungültiges Backup')}}})}
function renderProfile(){$('#view').innerHTML=`${pageTitle('Mein','Profil','Crew · Fahrzeug · App')}<div class="card member-row"><div class="avatar">${me().emoji}</div><div class="member-info"><b>${esc(me().name)}</b><span>${esc(me().car)} · ${esc(me().ig)}</span><div class="member-bio">${esc(me().bio||'')}</div><div class="member-tags">${(me().labels||[]).map(l=>`<span class="label function">${esc(l)}</span>`).join('')}</div></div><span class="label ${me().role}">${roleLabel(me().role)}</span></div><div class="section"><button class="btn primary wide" id="editProfile">Profil & Fahrzeug bearbeiten</button></div><div class="section admin-grid">${adminTool('user','Welcome & Crew DNA','Onboarding erneut öffnen','profileWelcome')}${adminTool('whatsapp','WhatsApp','Crew-Gruppe öffnen','profileWa')}${adminTool('backup','App & Updates',`Version ${APP_VERSION}`,'profileUpdate')}</div>`;$('#profileWelcome').onclick=openWelcomeCenter;$('#profileWa').onclick=openWhatsApp;$('#profileUpdate').onclick=openBackupUpdates;$('#editProfile').onclick=openProfileEditor}
function openProfileEditor(){const u=me();openModal('Profil bearbeiten',`<div class="field"><label>Name</label><input id="profName" value="${esc(u.name)}"></div><div class="field"><label>Instagram / Handle</label><input id="profIg" value="${esc(u.ig||'')}"></div><div class="field"><label>Fahrzeug</label><input id="profCar" value="${esc(u.car||'')}"></div><div class="field"><label>Über mich</label><textarea id="profBio">${esc(u.bio||'')}</textarea></div><button class="btn primary wide" id="saveProfile">Speichern</button>`,()=>$('#saveProfile').onclick=()=>{u.name=$('#profName').value.trim()||u.name;u.ig=$('#profIg').value.trim();u.car=$('#profCar').value.trim();u.bio=$('#profBio').value.trim();save();closeModal();render();toast('Profil gespeichert')})}
function openWhatsApp(){if(state.settings.whatsapp){location.href=state.settings.whatsapp;return}openModal('WhatsApp',`<div class="notice">Hinterlege einmal den Einladungslink eurer Gruppe.</div><div class="field"><label>Gruppenlink</label><input id="waLink" placeholder="https://chat.whatsapp.com/..."></div><button class="btn primary wide" id="saveWa">Speichern</button>`,()=>$('#saveWa').onclick=()=>{state.settings.whatsapp=$('#waLink').value.trim();save();closeModal();toast('WhatsApp-Link gespeichert')})}
function showNotifications(){const visible=state.announcements.filter(a=>!(a.hiddenBy||[]).includes(me().id));openModal('Benachrichtigungen',`<div class="list">${visible.map(a=>`<div class="card pad"><div style="display:flex;justify-content:space-between"><b>${esc(a.title)}</b><span>${(a.readBy||[]).includes(me().id)?'✓':'●'}</span></div><div class="muted tiny">${esc(a.created)}</div><div class="actions"><button class="btn outline sm" data-notif-open="${a.id}">Öffnen</button>${(a.readBy||[]).includes(me().id)?`<button class="btn bad sm" data-notif-hide="${a.id}">Entfernen</button>`:''}</div></div>`).join('')||'<div class="notice">Keine Benachrichtigungen.</div>'}</div><div class="section"><button class="btn outline wide" id="pushTestBtn">Push-Test</button></div>`,()=>{$$('[data-notif-open]').forEach(b=>b.onclick=()=>{closeModal();openAnnouncementDetail(b.dataset.notifOpen)});$$('[data-notif-hide]').forEach(b=>b.onclick=()=>{const a=state.announcements.find(x=>x.id===b.dataset.notifHide);a.hiddenBy??=[];if(!a.hiddenBy.includes(me().id))a.hiddenBy.push(me().id);save();closeModal();showNotifications()});$('#pushTestBtn').onclick=()=>pushTest()})}
function cleanAppUrl(){const u=new URL(location.href);u.search='';u.hash='';return u.toString()}
function previewUrlFor(uid,pageName='home'){const u=new URL(cleanAppUrl());u.searchParams.set('profile',uid);if(pageName!=='home')u.searchParams.set('page',pageName);return u.toString()}
async function copyText(v,msg='Link kopiert'){try{await navigator.clipboard.writeText(v);toast(msg)}catch{const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg)}}
async function shareAppLink(url=cleanAppUrl(),title='4 Wheels 1 Family'){if(navigator.share){try{await navigator.share({title,text:'4W1F Crew App',url});return}catch{}}copyText(url,'App-Link kopiert')}
async function installCrewApp(){if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}openModal('App installieren',`<div class="install-steps"><div><b>iPhone / iPad</b><span>Safari öffnen → Teilen → „Zum Home-Bildschirm“.</span></div><div><b>Android</b><span>Chrome öffnen → Menü → „App installieren“ oder „Zum Startbildschirm“.</span></div><div><b>Desktop</b><span>Im Browser das Installationssymbol in der Adressleiste verwenden, falls angeboten.</span></div></div>`)}
function openPreviewProfileSwitch(){openModal('Preview-Profil',`<div class="notice">Nur für die Admin-Testphase. Das ist kein Login und keine Sicherheitsfunktion.</div><div class="list">${state.users.map(u=>`<button class="card member-row clickable" data-switch="${u.id}"><div class="avatar">${u.emoji}</div><div class="member-info" style="text-align:left"><b>${esc(u.name)}</b><span>${roleLabel(u.role)} · ${esc(u.car||'Crew Member')}</span></div></button>`).join('')}</div>`,()=>$$('[data-switch]').forEach(b=>b.onclick=()=>{state.currentUser=b.dataset.switch;save();closeModal();page='home';render();window.__finalWelcomeShown=false;toast(`Vorschau: ${me().name}`)}))}
function openAccountCenter(){openModal('Profil & App',`<div class="card member-row"><div class="avatar">${me().emoji}</div><div class="member-info"><b>${esc(me().name)}</b><span>${roleLabel(me().role)} · ${esc(me().car||'Crew Member')}</span></div></div><div class="account-actions"><button class="btn primary wide" id="accountProfile">Mein Profil</button>${isAdmin()?'<button class="btn outline wide" id="accountRelease">App verteilen / Preview</button>':''}<button class="btn outline wide" id="accountSwitch">Vorschau-Profil wechseln</button><button class="btn outline wide" id="accountInstall">App installieren</button></div><div class="tiny muted" style="margin-top:12px">V${APP_VERSION} · Build ${BUILD}</div>`,()=>{$('#accountProfile').onclick=()=>{closeModal();page='profile';render()};$('#accountRelease')?.addEventListener('click',()=>{closeModal();openReleaseCenter()});$('#accountSwitch').onclick=()=>{closeModal();openPreviewProfileSwitch()};$('#accountInstall').onclick=installCrewApp})}
function releaseStatus(label,ok,text){return `<div class="release-status"><i class="${ok?'ok':'wait'}"></i><div><b>${label}</b><span>${text}</span></div></div>`}
function openReleaseCenter(){const admins=state.users.filter(u=>['owner','admin'].includes(u.role));openModal('Release Center',`<div class="card release-hero"><div class="eyebrow">V2.0 · Grande Finale</div><h3>Admin Preview</h3><p>Jetzt intern verteilen, prüfen und Änderungswünsche sammeln. Der breite Crew-Start folgt erst mit echtem Backend-Login und gemeinsamer Datenbank.</p><div class="release-buttons"><button class="btn primary" id="shareMainApp">${I('share')} App teilen</button><button class="btn outline" id="copyMainApp">Link kopieren</button><button class="btn outline" id="installMainApp">Installieren</button></div></div><div class="section"><div class="sectionhead"><h2>Admin-Preview Links</h2></div><div class="preview-links">${admins.map(u=>`<div class="card preview-link"><div class="avatar">${u.emoji}</div><div><b>${esc(u.name)}</b><span>${roleLabel(u.role)}</span></div><button class="btn outline sm" data-copy-preview="${u.id}">Kopieren</button><button class="btn primary sm" data-share-preview="${u.id}">Teilen</button></div>`).join('')}</div><div class="notice">Die Profil-Links sind nur Komfort für eure interne Vorschau. Sie ersetzen keinen echten Login.</div></div><div class="section"><div class="sectionhead"><h2>Launch-Status</h2></div><div class="card pad release-checklist">${releaseStatus('Mobile UI & PWA',true,'Finale Oberfläche, responsive Layouts, Installierbarkeit')}${releaseStatus('Admin Preview',true,'Individuelle Vorschau-Links und Rollenansichten')}${releaseStatus('Backend & Daten-Sync',false,'Vor breitem Crew-Start erforderlich')}${releaseStatus('Echter Login',false,'Geplant: passwortloser Magic-Link per E-Mail')}${releaseStatus('Server-Push & Live Sync',false,'Wird zusammen mit Backend aktiviert')}</div></div><div class="section card pad"><div class="eyebrow">Login-Entscheidung</div><h3 style="margin:5px 0">Später: E-Mail Magic Link</h3><div class="muted small">Für die Admin-Vorschau absichtlich kein Fake-Login. Beim echten Rollout ist ein passwortloser E-Mail-Link einfacher und sicherer als selbstgebaute Passwörter im Frontend.</div></div>`,()=>{$('#shareMainApp').onclick=()=>shareAppLink();$('#copyMainApp').onclick=()=>copyText(cleanAppUrl());$('#installMainApp').onclick=installCrewApp;$$('[data-copy-preview]').forEach(b=>b.onclick=()=>copyText(previewUrlFor(b.dataset.copyPreview),`${state.users.find(u=>u.id===b.dataset.copyPreview)?.name||'Admin'}-Link kopiert`));$$('[data-share-preview]').forEach(b=>b.onclick=()=>shareAppLink(previewUrlFor(b.dataset.sharePreview),'4W1F Admin Preview'))})}
function applyLaunchContext(){const q=new URLSearchParams(location.search);const pid=q.get('profile');if(pid){const u=state.users.find(x=>x.id===pid);if(u){state.currentUser=u.id;localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}}const p=q.get('page');if(['home','events','members','gallery','admin','profile','live','announcements'].includes(p))page=p}
async function pushTest(title='4 Wheels 1 Family',body='Neue Crew-Nachricht.',silent=false){if(!('Notification'in window)){if(!silent)toast('Push hier nicht unterstützt');return}const p=await Notification.requestPermission();if(p!=='granted'){if(!silent)toast('Benachrichtigungen nicht erlaubt');return}try{const reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body,tag:'4w1f-test'});state.settings.push=true;save();if(!silent)toast('Test-Push gesendet')}catch{if(!silent)toast('Push konnte nicht angezeigt werden')}}

async function checkForUpdates(manual=false){try{const r=await fetch(`./version.json?t=${Date.now()}`,{cache:'no-store'});const v=await r.json();if(v.version!==APP_VERSION){if(manual)toast(`Update ${v.version} wird geladen…`,'update');await updateRegistration?.update();return false}if(manual)toast(`App ist aktuell · V${APP_VERSION}`,'update');return true}catch{if(manual)toast('Update-Prüfung nicht möglich');return false}}
function initUpdates(){if(!('serviceWorker'in navigator))return;navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{updateRegistration=reg;reg.update().catch(()=>{});checkForUpdates(false);setInterval(()=>checkForUpdates(false),5*60*1000)}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem('4w1f-reloading'))return;sessionStorage.setItem('4w1f-reloading','1');location.reload()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){sessionStorage.removeItem('4w1f-reloading');updateRegistration?.update().catch(()=>{});checkForUpdates(false)}});const last=localStorage.getItem('4w1f-display-version');if(last&&last!==APP_VERSION)setTimeout(()=>toast(`Update installiert – Version ${APP_VERSION} ✓`,'update'),800);localStorage.setItem('4w1f-display-version',APP_VERSION)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('DOMContentLoaded',()=>window.bootstrapProduction?.());
</script>
<script src="./production.js"></script>
</body>
